<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1440">
<title>Admin — Media library</title>
<link rel="stylesheet" href="fonts.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700;9..144,800&amp;family=Source+Sans+3:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'Source Sans 3',system-ui,sans-serif;background:#F4F2EE;color:#16181D}
a{color:inherit;text-decoration:none}a:hover{color:#B8361E}
</style>
<style>#dc-root>*{margin-left:auto !important;margin-right:auto !important}</style>
<script src="mbl-runtime.js"></script>
</head>
<body>
<div id="dc-root"></div>
<template id="dc-template">

<div style="width: 1440px; min-height: 1180px; display: flex; background: #F4F2EE">

<!-- Sidebar -->
<aside style="width: 248px; flex-shrink: 0; background: #16181D; color: #C9C4BA; display: flex; flex-direction: column; gap: 28px; padding: 24px 14px; box-sizing: border-box">
<a href="Admin-Overview.html" style="padding: 0 10px; display: flex; align-items: baseline; gap: 8px">
<span style="font-family: Fraunces, Georgia, serif; font-size: 26px; font-weight: 800; color: #F6F3EE"><img src="logo-white.svg" alt="Maldives Business Ledger" style="display: block; height: 22px; width: auto"></span>
<span style="font-size: 12px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: #8A8F98">Admin</span>
</a>
<nav style="display: flex; flex-direction: column; gap: 2px">
<sc-for list="{{navItems}}" as="n" hint-placeholder-count="13">
<a href="{{n.href}}" style="display: flex; align-items: center; gap: 10px; height: 42px; padding: 0 12px; border-radius: 6px; font-size: 15px; font-weight: 600; background: {{n.bg}}; color: {{n.fg}}; border-left: 3px solid {{n.bar}}">{{n.label}}</a>
</sc-for>
</nav>
<div style="margin-top: auto; display: flex; align-items: center; gap: 10px; padding: 12px 10px; border-top: 1px solid #2A2D34">
<div style="width: 36px; height: 36px; border-radius: 999px; background: #3A3D44"></div>
<div style="display: flex; flex-direction: column"><span style="font-size: 14px; font-weight: 700; color: #F6F3EE">[Your name]</span><span style="font-size: 12px">Editor-in-chief</span></div>
</div>
</aside>

<div style="flex-grow: 1; display: flex; flex-direction: column">
<header style="height: 68px; background: #FFFFFF; border-bottom: 1px solid #E4DED3; display: flex; align-items: center; gap: 16px; padding: 0 32px">
<h1 style="margin: 0; font-size: 22px; font-weight: 700; flex-grow: 1">Media library</h1>
<span style="font-size: 13px; color: #5B5F66">[4,812] files · [38] GB</span>
<button type="button" style="height: 40px; padding: 0 18px; border-radius: 6px; border: none; background: {{accent}}; color: #FFFFFF; font-family: inherit; font-weight: 700; font-size: 14px; cursor: pointer">Upload</button>
</header>

<div style="padding: 24px 32px 40px; display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 24px">

<div style="grid-column: span 8; display: flex; flex-direction: column; gap: 16px">
<!-- Drop zone -->
<div style="border: 2px dashed #BDB6A8; border-radius: 10px; padding: 18px; display: flex; align-items: center; justify-content: center; gap: 10px; color: #4A4E55; font-size: 15px; background: #FAF9F7">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16V4M7 9l5-5 5 5"></path><path d="M4 16v3a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-3"></path></svg>
Drop photos, videos or files here — large photos are resized and compressed automatically
</div>
<!-- Filters -->
<div style="display: flex; gap: 10px; align-items: center">
<div role="tablist" style="display: flex; gap: 4px; background: #ECEAE6; border-radius: 8px; padding: 4px">
<sc-for list="{{kinds}}" as="k" hint-placeholder-count="5">
<button type="button" role="tab" onClick="{{k.pick}}" style="height: 34px; padding: 0 14px; border: none; border-radius: 6px; font-family: inherit; font-size: 13px; font-weight: 700; cursor: pointer; background: {{k.bg}}; color: #16181D">{{k.label}}</button>
</sc-for>
</div>
<input type="search" aria-label="Search media" placeholder="Search captions, tags, people…" style="flex-grow: 1; height: 42px; border: 1px solid #D9D3C7; border-radius: 6px; padding: 0 12px; font-size: 14px; font-family: inherit; background: #FFFFFF">
<select aria-label="Tag" style="height: 42px; border: 1px solid #D9D3C7; border-radius: 6px; padding: 0 10px; font-family: inherit; font-size: 14px; background: #FFFFFF"><option>All tags</option><option>Parliament</option><option>Harbour</option><option>Sports</option></select>
<select aria-label="Sort" style="height: 42px; border: 1px solid #D9D3C7; border-radius: 6px; padding: 0 10px; font-family: inherit; font-size: 14px; background: #FFFFFF"><option>Newest first</option><option>Oldest first</option><option>Most used</option><option>Not used yet</option></select>
</div>
<!-- Bulk bar -->
<div style="display: flex; align-items: center; gap: 12px; padding: 10px 14px; border-radius: 8px; background: #16181D; color: #FFFFFF; font-size: 14px">
<span style="font-weight: 700; flex-grow: 1">{{selCount}} selected</span>
<button type="button" style="height: 32px; padding: 0 12px; border: 1px solid #3A3D44; border-radius: 6px; background: transparent; color: #FFFFFF; font-family: inherit; font-weight: 700; font-size: 13px; cursor: pointer">Add tags</button>
<button type="button" style="height: 32px; padding: 0 12px; border: 1px solid #3A3D44; border-radius: 6px; background: transparent; color: #FFFFFF; font-family: inherit; font-weight: 700; font-size: 13px; cursor: pointer">Set credit</button>
<button type="button" style="height: 32px; padding: 0 12px; border: 1px solid #3A3D44; border-radius: 6px; background: transparent; color: #FFFFFF; font-family: inherit; font-weight: 700; font-size: 13px; cursor: pointer">Download</button>
<button type="button" style="height: 32px; padding: 0 12px; border: 1px solid #7A2A1C; border-radius: 6px; background: transparent; color: #F2B8AC; font-family: inherit; font-weight: 700; font-size: 13px; cursor: pointer">Delete</button>
</div>
<!-- Grid -->
<div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px">
<sc-for list="{{items}}" as="it" hint-placeholder-count="12">
<button type="button" onClick="{{it.pick}}" style="padding: 0; border: 2px solid {{it.ring}}; border-radius: 10px; background: #FFFFFF; overflow: hidden; text-align: left; font-family: inherit; cursor: pointer; display: flex; flex-direction: column">
<span style="height: 130px; background: {{it.tone}}; position: relative; display: block">
<span style="position: absolute; top: 8px; left: 8px; width: 22px; height: 22px; border-radius: 5px; background: {{it.checkBg}}; border: 2px solid #FFFFFF; color: #FFFFFF; font-size: 13px; font-weight: 700; display: flex; align-items: center; justify-content: center">{{it.check}}</span>
<span style="position: absolute; bottom: 8px; right: 8px; font-size: 11px; font-weight: 700; color: #FFFFFF; background: rgba(12,14,18,0.72); padding: 2px 6px; border-radius: 3px">{{it.kind}}</span>
</span>
<span style="padding: 10px 12px; display: flex; flex-direction: column; gap: 2px">
<span style="font-size: 14px; font-weight: 600; color: #16181D; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{it.caption}}</span>
<span style="font-size: 12px; color: #5B5F66">{{it.meta}}</span>
</span>
</button>
</sc-for>
</div>
</div>

<!-- Details panel -->
<div style="grid-column: span 4; background: #FFFFFF; border: 1px solid #E4DED3; border-radius: 10px; padding: 20px; display: flex; flex-direction: column; gap: 14px; align-self: start">
<div style="height: 220px; border-radius: 8px; background: {{cur.tone}}"></div>
<div style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 16px; font-weight: 700">{{cur.caption}}</span><span style="font-size: 13px; color: #5B5F66">{{cur.file}} · 1920 × 1080 · 412 KB</span></div>
<div style="display: flex; flex-direction: column; gap: 6px">
<label for="md-cap" style="font-size: 13px; font-weight: 700; color: #4A4E55">Caption</label>
<textarea id="md-cap" style="height: 64px; border: 1px solid #D9D3C7; border-radius: 6px; padding: 10px 12px; font-size: 14px; font-family: inherit; resize: none">{{cur.caption}}</textarea>
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<label for="md-credit" style="font-size: 13px; font-weight: 700; color: #4A4E55">Photo credit</label>
<input id="md-credit" type="text" value="{{cur.credit}}" style="height: 40px; border: 1px solid #D9D3C7; border-radius: 6px; padding: 0 12px; font-size: 14px; font-family: inherit">
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<label for="md-alt" style="font-size: 13px; font-weight: 700; color: #4A4E55">Alt text <span style="font-weight: 500; color: #5B5F66">— for screen readers &amp; Google</span></label>
<input id="md-alt" type="text" placeholder="Describe what’s in the photo" style="height: 40px; border: 1px solid #D9D3C7; border-radius: 6px; padding: 0 12px; font-size: 14px; font-family: inherit">
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<span style="font-size: 13px; font-weight: 700; color: #4A4E55">Tags</span>
<div style="display: flex; flex-wrap: wrap; gap: 6px"><sc-for list="{{cur.tags}}" as="tg" hint-placeholder-count="2"><span style="font-size: 13px; font-weight: 600; padding: 5px 10px; border-radius: 999px; background: #ECEAE6">{{tg}} ×</span></sc-for><span style="font-size: 13px; font-weight: 700; padding: 5px 10px; color: {{accent}}">+ Add</span></div>
</div>
<div style="display: flex; flex-direction: column; gap: 6px; padding-top: 6px; border-top: 1px solid #E4DED3">
<span style="font-size: 13px; font-weight: 700; color: #4A4E55">Used in</span>
<sc-for list="{{cur.used}}" as="u" hint-placeholder-count="1"><a href="Admin-Editor.html" style="font-size: 14px; font-weight: 600">{{u}} →</a></sc-for>
</div>
<sc-if value="{{cur.dup}}" hint-placeholder-val="{{false}}">
<div style="padding: 10px 12px; border-radius: 8px; background: #FBEBDD; color: #7A3A08; font-size: 13px; font-weight: 600">This photo looks like a duplicate of 2 others. Merge them?</div>
</sc-if>
<div style="display: flex; gap: 8px">
<button type="button" style="flex-grow: 1; height: 40px; border: none; border-radius: 6px; background: #16181D; color: #FFFFFF; font-family: inherit; font-weight: 700; font-size: 14px; cursor: pointer">Save</button>
<button type="button" style="height: 40px; padding: 0 14px; border: 1px solid #D9D3C7; border-radius: 6px; background: #FFFFFF; font-family: inherit; font-weight: 700; font-size: 14px; cursor: pointer">Crop</button>
</div>
</div>

</div>
</div>
</div>
</template>
<script>
class Component extends DCLogic {
renderVals() {
const accent = this.props.accent ?? '#C23B22';
const s = this.state || {};
const kind = s.kind || 'All';
const cur = s.cur ?? 0;
const sel = s.sel || [0];
const nav = [['Overview','Admin-Overview.html'],['Articles','Admin-Articles.html'],['New article','Admin-Editor.html'],['Upload video','Admin-Video.html'],['Homepage layout','Admin-Homepage.html'],['Media library','Admin-Media.html'],['Statistics','Admin-Stats.html'],['Ads','Admin-Ads.html'],['Comments','Admin-Comments.html'],['Categories & tags','Admin-Categories.html'],['Authors','Admin-Authors.html'],['Users & roles','Admin-Users.html'],['Settings','Admin-Settings.html']];
const active = 'Media library';
const all = [
['Harbour district at dawn', 'Photo', '#2E3A40', 'Used in 2 articles', 'harbour-dawn.jpg', '[Photographer name]', ['Harbour', 'City'], ['The quiet towns rebuilding their high streets', 'Car-free weekends approved'], false],
['Coffee roaster at work', 'Photo', '#5A4636', 'Used in 1 article', 'roaster-01.jpg', '[Photographer name]', ['Business'], ['Why small roasters are winning'], false],
['Island ferry, morning crossing', 'Photo', '#2F5A5E', 'Not used yet', 'ferry-crossing.jpg', '[Photographer name]', ['Travel'], ['—'], true],
['Satellite workshop interview', 'Video', '#3B4A63', '9:45 · Used in 1', 'workshop.mp4', '[Videographer]', ['Tech'], ['Inside the workshop building satellites'], false],
['Parliament session', 'Photo', '#5B3B4A', 'Used in 3 articles', 'parliament-0928.jpg', '[Photographer name]', ['Politics'], ['What the new housing bill changes'], false],
['Podcast episode 12', 'Audio', '#34506B', '48:20 · Used in 1', 'ep12.mp3', 'Maldives Business Ledger', ['Podcast'], ['Ep. 12'], false],
['Balcony garden', 'Photo', '#556B4A', 'Used in 1 article', 'balcony.jpg', '[Photographer name]', ['Lifestyle'], ['Balcony gardens that survive the monsoon'], false],
['Office four-day week', 'Photo', '#6A5343', 'Used in 1 article', 'office.jpg', '[Photographer name]', ['Business'], ['Four-day weeks, one year on'], false],
['Night market reel', 'Video', '#5A4636', '0:52 · Reel', 'night-market.mp4', '[Videographer]', ['Reels'], ['Homepage reels'], false],
['Stadium crowd', 'Photo', '#34506B', 'Not used yet', 'stadium.jpg', '[Photographer name]', ['Sports'], ['—'], false],
['Budget documents (PDF)', 'File', '#4A5A66', 'Used in 1 article', 'budget-2027.pdf', 'Ministry of Finance', ['Politics'], ['Five questions ahead of the budget vote'], false],
['Rooftop monsoon view', 'Photo', '#4A5A66', 'Used in 1 gallery', 'rooftops.jpg', '[Photographer name]', ['Weather'], ['Monsoon season, seen from the rooftops'], false]
];
const map = { All: null, Photos: 'Photo', Videos: 'Video', Audio: 'Audio', Files: 'File' };
const c = all[cur];
return {
accent,
navItems: nav.map(([label, href]) => ({ label, href, bg: label === active ? '#2A2D34' : 'transparent', fg: label === active ? '#FFFFFF' : '#C9C4BA', bar: label === active ? accent : 'transparent' })),
kinds: Object.keys(map).map(k => ({ label: k, pick: () => this.setState({ kind: k }), bg: k === kind ? '#FFFFFF' : 'transparent' })),
selCount: sel.length,
items: all.map((r, i) => ({ i, r })).filter(({ r }) => !map[kind] || r[1] === map[kind]).map(({ i, r }) => {
const on = sel.includes(i);
return { caption: r[0], kind: r[1], tone: r[2], meta: r[3], ring: i === cur ? accent : 'transparent', check: on ? '✓' : '', checkBg: on ? accent : 'rgba(12,14,18,0.35)',
pick: () => this.setState({ cur: i, sel: on ? sel.filter(x => x !== i) : sel.concat(i) }) };
}),
cur: { caption: c[0], tone: c[2], file: c[4], credit: c[5], tags: c[6], used: c[7], dup: c[8] }
};
}
}
MBL.boot(Component, {"accent":{"editor":"color","default":"#C23B22"},"$preview":{"width":1440,"height":1180}});
</script>
</body>
</html>
