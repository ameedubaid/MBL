<figcaption style="font-size: 15px; color: #5B5F66">[ފޮޓޯގެ ތަފްސީލު · ފޮޓޯ: ފޮޓޯގްރާފަރ]</figcaption>

<p style="margin: 0; font-size: 21px; line-height: 2">ފަސް އަހަރު ކުރިން ރަށުގެ މައިގަނޑު މަގުގައި ހުރި ފިހާރަތަކުގެ ބައިވަރު ތަނެއް ބަންދުކޮށްފައި ހުރީ. މިއަދު އެ މަގުގައި ބޭކަރީއަކާއި، ސައިކަލު ރިޕެއާކުރާ ތަނަކާއި، ކުޑަ ފޮތް ފިހާރައެއް ހުޅުވިފައި ވެއެވެ.</p>
<p style="margin: 0; font-size: 21px; line-height: 2">މި ބަދަލު އައީ އެއް ބޮޑު މަޝްރޫއަކުން ނޫނެވެ. އާ ވިޔަފާރިވެރިންނަށް ކުރު މުއްދަތުގެ ކުލި ދިނުމާއި، ހަފްތާ ބަންދު ދުވަސްތަކުގައި ބާޒާރު ބޭއްވުމާއި، މަގުގައި ދުއްވާ ބާރުމިން ކުޑަކުރުމުން ކަމަށް ރައްޔިތުން ބުނެއެވެ.</p>

<p style="margin: 0; font-size: 21px; line-height: 2">ވިޔަފާރިވެރިން ބުނާ ގޮތުގައި އެންމެ ބޮޑު ބަދަލަކީ މަގަށް އަންނަ މީހުން އިތުރުވުމެވެ. ހޮނިހިރު ދުވަސްތަކުގައި އާއިލާތައް ހިނގާފައި މަގަށް އަންނައިރު، ބާޒާރު ރޭރޭގައި ކެފޭތައް ލަސްތަކަށް ހުޅުވާލައެވެ.</p>

<h2 style="margin: 12px 0 0; font-size: 30px; font-weight: 700">އެހެން ރަށްތަކަށް ދަސްކުރެވޭނެ ކަންކަން</h2>
<p style="margin: 0; font-size: 21px; line-height: 2">ޕްލޭނަރުން ދައްކަނީ ތިން ފިލާވަޅު: ފެށުން ލުއިކުރުން، މީހުންނަށް މަޑުކުރަން ރީތި ތަނެއް ހެދުން، އަދި ރައްޔިތުންނަށް ކުރިއަށް ދާން ދިނުން.</p>
<blockquote style="margin: 8px 0; padding: 8px 28px 8px 0; border-right: 4px solid {{accent}}; font-size: 28px; line-height: 1.7; font-weight: 700">“[ފިހާރައެއްގެ ވެރިއެއް ނުވަތަ ޕްލޭނަރެއްގެ ބަސް މިތާ]”</blockquote>
<p style="margin: 0; font-size: 21px; line-height: 2">މިހާރު މި މަގުގެ ހުރިހާ ފިހާރައެއް ފުރިފައި ވެއެވެ. ކުރިއަށް އޮތް ގޮންޖެހުމަކީ، މި މަގު އަލުން ދިރުވި މީހުންނަށް ހުރެވޭނެ ވަރަށް ކުލި ކުޑަކޮށް ބެހެއްޓުން ކަމަށް ރައްޔިތުން ބުނެއެވެ.</p>
