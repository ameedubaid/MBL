<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1440">
<title>Admin — Users and roles</title>
<link rel="stylesheet" href="fonts.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700;9..144,800&amp;family=Source+Sans+3:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'Source Sans 3',system-ui,sans-serif;background:#F4F2EE;color:#16181D}
a{color:inherit;text-decoration:none}a:hover{color:#B8361E}
</style>
<script src="mbl-runtime.js"></script>
</head>
<body>
<div id="dc-root"></div>
<template id="dc-template">

<div style="width: 1440px; min-height: 1240px; display: flex; background: #F4F2EE">

<!-- Sidebar -->
<aside style="width: 248px; flex-shrink: 0; background: #16181D; color: #C9C4BA; display: flex; flex-direction: column; gap: 28px; padding: 24px 14px; box-sizing: border-box">
<a href="Admin-Overview.html" style="padding: 0 10px; display: flex; align-items: baseline; gap: 8px">
<span style="font-family: Fraunces, Georgia, serif; font-size: 26px; font-weight: 800; color: #F6F3EE"><img src="logo-white.svg" alt="Maldives Business Ledger" style="display: block; height: 22px; width: auto"></span>
<span style="font-size: 12px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: #8A8F98">Admin</span>
</a>
<nav style="display: flex; flex-direction: column; gap: 2px">
<sc-for list="{{navItems}}" as="n" hint-placeholder-count="13">
<a href="{{n.href}}" style="display: flex; align-items: center; gap: 10px; height: 42px; padding: 0 12px; border-radius: 6px; font-size: 15px; font-weight: 600; background: {{n.bg}}; color: {{n.fg}}; border-left: 3px solid {{n.bar}}">{{n.label}}</a>
</sc-for>
</nav>
<div style="margin-top: auto; display: flex; align-items: center; gap: 10px; padding: 12px 10px; border-top: 1px solid #2A2D34">
<div style="width: 36px; height: 36px; border-radius: 999px; background: #3A3D44"></div>
<div style="display: flex; flex-direction: column"><span style="font-size: 14px; font-weight: 700; color: #F6F3EE">[Your name]</span><span style="font-size: 12px">Editor-in-chief</span></div>
</div>
</aside>

<div style="flex-grow: 1; display: flex; flex-direction: column">
<header style="height: 68px; background: #FFFFFF; border-bottom: 1px solid #E4DED3; display: flex; align-items: center; gap: 16px; padding: 0 32px">
<h1 style="margin: 0; font-size: 22px; font-weight: 700; flex-grow: 1">Users &amp; roles</h1>
<button type="button" style="height: 40px; padding: 0 18px; border-radius: 6px; border: none; background: {{accent}}; color: #FFFFFF; font-family: inherit; font-weight: 700; font-size: 14px; cursor: pointer">+ Invite someone</button>
</header>

<div style="padding: 24px 32px 40px; display: flex; flex-direction: column; gap: 24px">

<!-- Team -->
<div style="background: #FFFFFF; border: 1px solid #E4DED3; border-radius: 10px; overflow: hidden">
<div style="display: grid; grid-template-columns: minmax(0, 1fr) 170px 150px 150px 150px 80px; gap: 14px; padding: 12px 20px; background: #FAF9F7; border-bottom: 1px solid #E4DED3; font-size: 12px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: #5B5F66">
<span>Person</span><span>Role</span><span>Two-step login</span><span>Last active</span><span>Status</span><span></span>
</div>
<sc-for list="{{users}}" as="u" hint-placeholder-count="7">
<div style="display: grid; grid-template-columns: minmax(0, 1fr) 170px 150px 150px 150px 80px; gap: 14px; align-items: center; padding: 12px 20px; border-bottom: 1px solid #F0ECE5; font-size: 14px">
<div style="display: flex; align-items: center; gap: 12px"><div style="width: 36px; height: 36px; border-radius: 999px; background: #D9D3C7"></div><div style="display: flex; flex-direction: column"><span style="font-weight: 700">{{u.name}}</span><span style="font-size: 12px; color: #5B5F66">{{u.email}}</span></div></div>
<select aria-label="Role" style="height: 36px; border: 1px solid #D9D3C7; border-radius: 6px; padding: 0 8px; font-family: inherit; font-size: 14px; background: #FFFFFF"><option>{{u.role}}</option><option>Admin</option><option>Editor</option><option>Reporter</option><option>Contributor</option><option>Ad manager</option></select>
<span style="color: {{u.tfaC}}; font-weight: 600">{{u.tfa}}</span>
<span style="color: #4A4E55">{{u.last}}</span>
<span style="justify-self: start; font-size: 12px; font-weight: 700; padding: 4px 10px; border-radius: 999px; background: {{u.sBg}}; color: {{u.sFg}}">{{u.status}}</span>
<a href="#" style="font-weight: 700; color: {{accent}}">Edit</a>
</div>
</sc-for>
</div>

<!-- Roles -->
<div style="background: #FFFFFF; border: 1px solid #E4DED3; border-radius: 10px; overflow: hidden">
<div style="padding: 16px 20px; border-bottom: 1px solid #E4DED3; display: flex; flex-direction: column; gap: 2px"><h2 style="margin: 0; font-size: 16px; font-weight: 700">What each role can do</h2><span style="font-size: 13px; color: #5B5F66">Click a box to change a permission.</span></div>
<div style="display: grid; grid-template-columns: minmax(0, 1fr) repeat(5, 120px); gap: 0; font-size: 14px">
<span style="padding: 12px 20px; background: #FAF9F7; font-size: 12px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: #5B5F66">Permission</span>
<sc-for list="{{roles}}" as="r" hint-placeholder-count="5"><span style="padding: 12px 8px; background: #FAF9F7; font-size: 12px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: #5B5F66; text-align: center">{{r}}</span></sc-for>
</div>
<sc-for list="{{perms}}" as="p" hint-placeholder-count="9">
<div style="display: grid; grid-template-columns: minmax(0, 1fr) repeat(5, 120px); align-items: center; border-top: 1px solid #F0ECE5; font-size: 14px">
<span style="padding: 10px 20px; font-weight: 600">{{p.name}}</span>
<sc-for list="{{p.cells}}" as="c" hint-placeholder-count="5">
<span style="display: flex; justify-content: center; padding: 8px"><button type="button" onClick="{{c.toggle}}" aria-label="{{c.label}}" style="width: 28px; height: 28px; border-radius: 6px; border: 2px solid {{c.border}}; background: {{c.bg}}; color: #FFFFFF; font-weight: 700; font-family: inherit; cursor: pointer">{{c.mark}}</button></span>
</sc-for>
</div>
</sc-for>
</div>

</div>
</div>
</div>
</template>
<script>
class Component extends DCLogic {
renderVals() {
const accent = this.props.accent ?? '#C23B22';
const s = this.state || {};
const flips = s.flips || {};
const nav = [['Overview','Admin-Overview.html'],['Articles','Admin-Articles.html'],['New article','Admin-Editor.html'],['Upload video','Admin-Video.html'],['Homepage layout','Admin-Homepage.html'],['Media library','Admin-Media.html'],['Statistics','Admin-Stats.html'],['Ads','Admin-Ads.html'],['Comments','Admin-Comments.html'],['Categories & tags','Admin-Categories.html'],['Authors','Admin-Authors.html'],['Users & roles','Admin-Users.html'],['Settings','Admin-Settings.html']];
const active = 'Users & roles';
const ST = { Active: ['#E3F1EA', '#1E6B4F'], Invited: ['#E2ECF7', '#1F5FA8'], Suspended: ['#ECEAE6', '#4A4E55'] };
const users = [
['[Your name]', 'you@[domain]', 'Admin', 'On', 'Now', 'Active'],
['Hassan M.', 'hassan@[domain]', 'Editor', 'On', '12 min ago', 'Active'],
['Aishath N.', 'aishath@[domain]', 'Reporter', 'On', '5 min ago', 'Active'],
['Mariyam S.', 'mariyam@[domain]', 'Reporter', 'Off', '1 hr ago', 'Active'],
['Ibrahim F.', 'ibrahim@[domain]', 'Reporter', 'On', '3 hr ago', 'Active'],
['Video team', 'video@[domain]', 'Contributor', 'On', 'Yesterday', 'Active'],
['[Sales person]', 'sales@[domain]', 'Ad manager', '—', 'Not yet', 'Invited']
].map(u => ({ name: u[0], email: u[1], role: u[2], tfa: u[3] === 'Off' ? 'Off — remind' : u[3], tfaC: u[3] === 'Off' ? '#B8361E' : '#4A4E55', last: u[4], status: u[5], sBg: ST[u[5]][0], sFg: ST[u[5]][1] }));
const roles = ['Admin', 'Editor', 'Reporter', 'Contributor', 'Ad manager'];
const base = [
['Write and edit own drafts', [1,1,1,1,0]],
['Edit anyone’s articles', [1,1,0,0,0]],
['Publish and schedule', [1,1,0,0,0]],
['Arrange the homepage', [1,1,0,0,0]],
['Upload to media library', [1,1,1,1,0]],
['Approve comments', [1,1,0,0,0]],
['Manage ads', [1,0,0,0,1]],
['See statistics', [1,1,1,0,1]],
['Manage users & settings', [1,0,0,0,0]]
];
return {
accent,
navItems: nav.map(([label, href]) => ({ label, href, bg: label === active ? '#2A2D34' : 'transparent', fg: label === active ? '#FFFFFF' : '#C9C4BA', bar: label === active ? accent : 'transparent' })),
users, roles,
perms: base.map(([name, vals], pi) => ({ name, cells: vals.map((v, ri) => {
const key = pi + '-' + ri; const on = flips[key] ? !v : !!v;
return { mark: on ? '✓' : '', bg: on ? '#16181D' : '#FFFFFF', border: on ? '#16181D' : '#BDB6A8', label: roles[ri] + ': ' + name, toggle: () => this.setState({ flips: Object.assign({}, flips, { [key]: !flips[key] }) }) };
}) }))
};
}
}
MBL.boot(Component, {"accent":{"editor":"color","default":"#C23B22"},"$preview":{"width":1440,"height":1240}});
</script>
</body>
</html>
