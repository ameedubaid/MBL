<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1440">
<title>Admin — Categories and tags</title>
<link rel="stylesheet" href="fonts.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700;9..144,800&amp;family=Source+Sans+3:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'Source Sans 3',system-ui,sans-serif;background:#F4F2EE;color:#16181D}
a{color:inherit;text-decoration:none}a:hover{color:#B8361E}
</style>
<style>#dc-root>*{margin-left:auto !important;margin-right:auto !important}</style>
<script src="mbl-runtime.js"></script>
</head>
<body>
<div id="dc-root"></div>
<template id="dc-template">

<div style="width: 1440px; min-height: 1280px; display: flex; background: #F4F2EE">

<!-- Sidebar -->
<aside style="width: 248px; flex-shrink: 0; background: #16181D; color: #C9C4BA; display: flex; flex-direction: column; gap: 28px; padding: 24px 14px; box-sizing: border-box">
<a href="Admin-Overview.html" style="padding: 0 10px; display: flex; align-items: baseline; gap: 8px">
<span style="font-family: Fraunces, Georgia, serif; font-size: 26px; font-weight: 800; color: #F6F3EE"><img src="logo-white.svg" alt="Maldives Business Ledger" style="display: block; height: 22px; width: auto"></span>
<span style="font-size: 12px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: #8A8F98">Admin</span>
</a>
<nav style="display: flex; flex-direction: column; gap: 2px">
<sc-for list="{{navItems}}" as="n" hint-placeholder-count="13">
<a href="{{n.href}}" style="display: flex; align-items: center; gap: 10px; height: 42px; padding: 0 12px; border-radius: 6px; font-size: 15px; font-weight: 600; background: {{n.bg}}; color: {{n.fg}}; border-left: 3px solid {{n.bar}}">{{n.label}}</a>
</sc-for>
</nav>
<div style="margin-top: auto; display: flex; align-items: center; gap: 10px; padding: 12px 10px; border-top: 1px solid #2A2D34">
<div style="width: 36px; height: 36px; border-radius: 999px; background: #3A3D44"></div>
<div style="display: flex; flex-direction: column"><span style="font-size: 14px; font-weight: 700; color: #F6F3EE">[Your name]</span><span style="font-size: 12px">Editor-in-chief</span></div>
</div>
</aside>

<div style="flex-grow: 1; display: flex; flex-direction: column">
<header style="height: 68px; background: #FFFFFF; border-bottom: 1px solid #E4DED3; display: flex; align-items: center; gap: 16px; padding: 0 32px">
<h1 style="margin: 0; font-size: 22px; font-weight: 700; flex-grow: 1">Categories &amp; tags</h1>
<button type="button" style="height: 40px; padding: 0 18px; border-radius: 6px; border: none; background: {{accent}}; color: #FFFFFF; font-family: inherit; font-weight: 700; font-size: 14px; cursor: pointer">+ New section</button>
</header>

<div style="padding: 24px 32px 40px; display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 24px">

<!-- Sections = website menu -->
<div style="grid-column: span 5; display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; flex-direction: column; gap: 2px"><h2 style="margin: 0; font-size: 16px; font-weight: 700">Sections</h2><span style="font-size: 13px; color: #5B5F66">This order is your website menu, left to right. Drag to reorder.</span></div>
<div style="display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 10px; background: #ECEAE6; font-size: 14px; color: #4A4E55"><span style="font-weight: 700; color: #16181D">Home</span><span>always first in the menu</span></div>
<sc-for list="{{sections}}" as="c" hint-placeholder-count="7">
<button type="button" onClick="{{c.pick}}" style="display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 10px; border: 2px solid {{c.ring}}; background: #FFFFFF; font-family: inherit; text-align: left; cursor: pointer">
<span aria-hidden="true" style="color: #8A8F98; font-size: 16px">⋮⋮</span>
<span style="display: flex; flex-direction: column; flex-grow: 1"><span style="font-size: 15px; font-weight: 700; color: #16181D">{{c.name}}</span><span style="font-size: 12px; color: #5B5F66">/{{c.slug}} · {{c.count}} articles</span></span>
<sc-if value="{{c.home}}" hint-placeholder-val="{{false}}"><span style="font-size: 11px; font-weight: 700; padding: 3px 8px; border-radius: 999px; background: #E3F1EA; color: #1E6B4F">Homepage column</span></sc-if>
</button>
</sc-for>
</div>

<!-- Section editor -->
<div style="grid-column: span 7; display: flex; flex-direction: column; gap: 16px">
<div style="background: #FFFFFF; border: 1px solid #E4DED3; border-radius: 10px; padding: 22px; display: flex; flex-direction: column; gap: 16px">
<div style="display: flex; align-items: center"><h2 style="margin: 0; font-size: 20px; font-weight: 700; flex-grow: 1">{{cur.name}}</h2><a href="Category.html" style="font-size: 13px; font-weight: 700; color: {{accent}}">View section page →</a></div>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px">
<div style="display: flex; flex-direction: column; gap: 6px"><label for="ct-en" style="font-size: 13px; font-weight: 700; color: #4A4E55">Name (English)</label><input id="ct-en" type="text" value="{{cur.name}}" style="height: 42px; border: 1px solid #D9D3C7; border-radius: 6px; padding: 0 12px; font-size: 15px; font-family: inherit"></div>
<div style="display: flex; flex-direction: column; gap: 6px"><label for="ct-dv" style="font-size: 13px; font-weight: 700; color: #4A4E55">Name (Dhivehi)</label><input id="ct-dv" type="text" dir="rtl" placeholder="Add later" style="height: 42px; border: 1px solid #D9D3C7; border-radius: 6px; padding: 0 12px; font-size: 15px; font-family: inherit"></div>
</div>
<div style="display: flex; flex-direction: column; gap: 6px"><label for="ct-slug" style="font-size: 13px; font-weight: 700; color: #4A4E55">Web address</label><div style="display: flex; align-items: center; height: 42px; border: 1px solid #D9D3C7; border-radius: 6px; overflow: hidden"><span style="padding: 0 10px; background: #FAF9F7; height: 42px; display: flex; align-items: center; font-size: 14px; color: #5B5F66; border-right: 1px solid #D9D3C7">[your-domain]/</span><input id="ct-slug" type="text" value="{{cur.slug}}" style="flex-grow: 1; height: 40px; border: none; padding: 0 10px; font-size: 14px; font-family: inherit"></div></div>
<div style="display: flex; flex-direction: column; gap: 6px"><label for="ct-desc" style="font-size: 13px; font-weight: 700; color: #4A4E55">Short description <span style="font-weight: 500; color: #5B5F66">— shown under the title on the section page</span></label><input id="ct-desc" type="text" value="{{cur.desc}}" style="height: 42px; border: 1px solid #D9D3C7; border-radius: 6px; padding: 0 12px; font-size: 15px; font-family: inherit"></div>
<div style="display: flex; flex-direction: column; gap: 8px">
<span style="font-size: 13px; font-weight: 700; color: #4A4E55">Sub-sections <span style="font-weight: 500; color: #5B5F66">— the filter buttons on the section page</span></span>
<div style="display: flex; flex-wrap: wrap; gap: 8px"><sc-for list="{{cur.subs}}" as="sb" hint-placeholder-count="4"><span style="font-size: 14px; font-weight: 600; padding: 7px 12px; border-radius: 999px; border: 1px solid #BDB6A8">{{sb}} ×</span></sc-for><button type="button" style="height: 34px; padding: 0 12px; border: 1px dashed #BDB6A8; border-radius: 999px; background: transparent; font-family: inherit; font-weight: 700; font-size: 13px; cursor: pointer">+ Add</button></div>
</div>
<div style="display: flex; flex-direction: column; gap: 10px; padding-top: 6px; border-top: 1px solid #E4DED3">
<label style="display: flex; align-items: center; gap: 10px; font-size: 14px"><input type="checkbox" checked style="width: 18px; height: 18px"> Show in the website menu</label>
<label style="display: flex; align-items: center; gap: 10px; font-size: 14px"><input type="checkbox" style="width: 18px; height: 18px"> Show as a column on the homepage <span style="color: #5B5F66">(up to 3 — set in Homepage layout)</span></label>
</div>
<div style="display: flex; gap: 8px"><button type="button" style="height: 42px; padding: 0 20px; border: none; border-radius: 6px; background: #16181D; color: #FFFFFF; font-family: inherit; font-weight: 700; font-size: 14px; cursor: pointer">Save section</button><span style="flex-grow: 1"></span><button type="button" style="height: 42px; padding: 0 14px; border: none; background: transparent; color: #B8361E; font-family: inherit; font-weight: 700; font-size: 14px; cursor: pointer">Hide section</button></div>
</div>

<!-- Tags -->
<div style="background: #FFFFFF; border: 1px solid #E4DED3; border-radius: 10px; padding: 22px; display: flex; flex-direction: column; gap: 14px">
<div style="display: flex; align-items: center; gap: 12px"><h2 style="margin: 0; font-size: 16px; font-weight: 700; flex-grow: 1">Tags</h2><input type="search" aria-label="Search tags" placeholder="Search tags…" style="width: 240px; height: 38px; border: 1px solid #D9D3C7; border-radius: 6px; padding: 0 12px; font-size: 14px; font-family: inherit"></div>
<div style="padding: 10px 12px; border-radius: 8px; background: #FBEBDD; color: #7A3A08; font-size: 13px; font-weight: 600; display: flex; align-items: center; gap: 10px"><span style="flex-grow: 1">“Parliament” and “parliament” look like the same tag.</span><button type="button" style="height: 30px; padding: 0 12px; border: none; border-radius: 6px; background: #FFFFFF; font-family: inherit; font-weight: 700; font-size: 12px; cursor: pointer">Merge</button></div>
<div style="display: flex; flex-wrap: wrap; gap: 8px">
<sc-for list="{{tags}}" as="tg" hint-placeholder-count="12">
<span style="font-size: 14px; font-weight: 600; padding: 7px 12px; border-radius: 999px; background: #F4F2EE">{{tg.t}} <span style="color: #5B5F66; font-weight: 500">{{tg.n}}</span></span>
</sc-for>
</div>
</div>
</div>

</div>
</div>
</div>
</template>
<script>
class Component extends DCLogic {
renderVals() {
const accent = this.props.accent ?? '#C23B22';
const s = this.state || {};
const cur = s.cur || 'Tech';
const nav = [['Overview','Admin-Overview.html'],['Articles','Admin-Articles.html'],['New article','Admin-Editor.html'],['Upload video','Admin-Video.html'],['Homepage layout','Admin-Homepage.html'],['Media library','Admin-Media.html'],['Statistics','Admin-Stats.html'],['Ads','Admin-Ads.html'],['Comments','Admin-Comments.html'],['Categories & tags','Admin-Categories.html'],['Authors','Admin-Authors.html'],['Users & roles','Admin-Users.html'],['Settings','Admin-Settings.html']];
const active = 'Categories & tags';
const data = [
['Business', 'business', '[212]', true, 'Companies, money and the local economy.', ['Economy', 'Tourism', 'Markets']],
['Travel', 'travel', '[96]', false, 'Islands, routes and places worth the trip.', ['Islands', 'Food', 'Guides']],
['Tech', 'tech', '[141]', false, 'Gadgets, apps and the people building what comes next.', ['Gadgets', 'Apps', 'Science', 'Startups']],
['Politics', 'politics', '[318]', true, 'Government, parliament and the decisions that shape daily life.', ['Parliament', 'Councils', 'Elections']],
['Lifestyle', 'lifestyle', '[187]', true, 'Food, homes, health and weekends.', ['Food', 'Home', 'Wellbeing']],
['Report', 'report', '[64]', false, 'Long reads and in-depth reporting.', ['Investigations', 'Features']],
['Opinion', 'opinion', '[88]', false, 'Columns and views from our writers and readers.', ['Columns', 'Letters']]
];
const c = data.find(d => d[0] === cur);
return {
accent,
navItems: nav.map(([label, href]) => ({ label, href, bg: label === active ? '#2A2D34' : 'transparent', fg: label === active ? '#FFFFFF' : '#C9C4BA', bar: label === active ? accent : 'transparent' })),
sections: data.map(d => ({ name: d[0], slug: d[1], count: d[2], home: d[3], ring: d[0] === cur ? '#16181D' : '#E4DED3', pick: () => this.setState({ cur: d[0] }) })),
cur: { name: c[0], slug: c[1], desc: c[4], subs: c[5] },
tags: [['Housing bill', 42], ['Parliament', 118], ['parliament', 3], ['Harbour', 27], ['Coffee', 9], ['Ferries', 14], ['Budget 2027', 31], ['Monsoon', 22], ['Football', 56], ['Startups', 19], ['Tourism', 64], ['Schools', 23]].map(([t, n]) => ({ t, n }))
};
}
}
MBL.boot(Component, {"accent":{"editor":"color","default":"#C23B22"},"$preview":{"width":1440,"height":1280}});
</script>
</body>
</html>
