<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1440">
<title>Admin — Upload video</title>
<link rel="stylesheet" href="fonts.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700;9..144,800&amp;family=Source+Sans+3:wght@400;500;600;700&amp;family=Noto+Sans+Thaana:wght@400;700&amp;display=swap" rel="stylesheet">
<style>

body{margin:0;font-family:'Source Sans 3',system-ui,sans-serif;background:#F4F2EE;color:#16181D}
a{color:inherit;text-decoration:none}a:hover{color:#B8361E}
</style>
<style>#dc-root>*{margin-left:auto !important;margin-right:auto !important}</style>
<script src="mbl-runtime.js"></script>
</head>
<body>
<div id="dc-root"></div>
<template id="dc-template">

<div style="width: 1440px; min-height: 1400px; display: flex; background: #F4F2EE">

<!-- Sidebar -->
<aside style="width: 248px; flex-shrink: 0; background: #16181D; color: #C9C4BA; display: flex; flex-direction: column; gap: 28px; padding: 24px 14px; box-sizing: border-box">
<a href="Admin-Overview.html" style="padding: 0 10px; display: flex; align-items: baseline; gap: 8px">
<span style="font-family: Fraunces, Georgia, serif; font-size: 26px; font-weight: 800; color: #F6F3EE"><img src="logo-white.svg" alt="Maldives Business Ledger" style="display: block; height: 22px; width: auto"></span>
<span style="font-size: 12px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: #8A8F98">Admin</span>
</a>
<nav style="display: flex; flex-direction: column; gap: 2px">
<sc-for list="{{navItems}}" as="n" hint-placeholder-count="13">
<a href="{{n.href}}" style="display: flex; align-items: center; gap: 10px; height: 42px; padding: 0 12px; border-radius: 6px; font-size: 15px; font-weight: 600; background: {{n.bg}}; color: {{n.fg}}; border-left: 3px solid {{n.bar}}">{{n.label}}</a>
</sc-for>
</nav>
<div style="margin-top: auto; display: flex; align-items: center; gap: 10px; padding: 12px 10px; border-top: 1px solid #2A2D34">
<div style="width: 36px; height: 36px; border-radius: 999px; background: #3A3D44"></div>
<div style="display: flex; flex-direction: column"><span style="font-size: 14px; font-weight: 700; color: #F6F3EE">[Your name]</span><span style="font-size: 12px">Editor-in-chief</span></div>
</div>
</aside>

<div style="flex-grow: 1; display: flex; flex-direction: column">
<header style="height: 68px; background: #FFFFFF; border-bottom: 1px solid #E4DED3; display: flex; align-items: center; gap: 14px; padding: 0 32px">
<div style="display: flex; flex-direction: column; flex-grow: 1">
<h1 style="margin: 0; font-size: 20px; font-weight: 700">Upload video</h1>
<span style="font-size: 12px; color: #5B5F66">Videos and reels for the site and your social accounts</span>
</div>
<div role="group" aria-label="Language" style="display: flex; border: 1px solid #D9D3C7; border-radius: 6px; overflow: hidden">
<button type="button" onClick="{{setEN}}" style="height: 36px; padding: 0 14px; border: none; font-family: inherit; font-weight: 700; font-size: 13px; cursor: pointer; background: {{enBg}}; color: {{enFg}}">English</button>
<button type="button" onClick="{{setDV}}" style="height: 36px; padding: 0 14px; border: none; font-family: inherit; font-weight: 700; font-size: 13px; cursor: pointer; background: {{dvBg}}; color: {{dvFg}}">Dhivehi</button>
</div>
</header>

<div style="padding: 24px 32px 48px; display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 24px; align-items: start">

<div style="display: flex; flex-direction: column; gap: 16px">

<!-- Type + file -->
<div style="background: #FFFFFF; border: 1px solid #E4DED3; border-radius: 10px; padding: 22px; display: flex; flex-direction: column; gap: 18px">
<div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px">
<sc-for list="{{kinds}}" as="k" hint-placeholder-count="2">
<button type="button" onClick="{{k.pick}}" aria-pressed="{{k.on}}" style="display: flex; align-items: center; gap: 14px; padding: 14px 16px; border-radius: 10px; border: 2px solid {{k.border}}; background: {{k.bg}}; font-family: inherit; text-align: left; cursor: pointer; color: #16181D">
<span style="width: {{k.iw}}; height: {{k.ih}}; border-radius: 3px; border: 2px solid #16181D; flex-shrink: 0"></span>
<span style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 16px; font-weight: 700">{{k.label}}</span><span style="font-size: 13px; color: #4A4E55">{{k.sub}}</span></span>
</button>
</sc-for>
</div>

<div style="display: flex; gap: 20px; align-items: stretch">
<div style="width: {{dropW}}; height: {{dropH}}; flex-shrink: 0; border-radius: 10px; border: 2px dashed #C9C4BA; background: #FAF8F5; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; color: #4A4E55; text-align: center; padding: 12px; box-sizing: border-box">
<svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16V4"></path><path d="M7 9l5-5 5 5"></path><path d="M4 20h16"></path></svg>
<span style="font-size: 15px; font-weight: 700">Drop video file</span>
<span style="font-size: 13px">or <a href="#" style="color: {{accent}}; font-weight: 700">browse</a></span>
</div>
<div style="display: flex; flex-direction: column; gap: 12px; flex-grow: 1; min-width: 0">
<div style="display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: #4A4E55; padding: 12px 14px; border-radius: 8px; background: #F4F2EE">
<span style="font-weight: 700; color: #16181D">{{specTitle}}</span>
<sc-for list="{{specs}}" as="sp" hint-placeholder-count="3"><span>{{sp}}</span></sc-for>
</div>
<div style="display: flex; flex-direction: column; gap: 4px"><label for="v-yt" style="font-size: 12px; font-weight: 700; color: #4A4E55">Or paste a YouTube link</label><input id="v-yt" type="url" placeholder="https://youtube.com/…" style="width: 100%; box-sizing: border-box; height: 40px; border: 1px solid #D9D3C7; border-radius: 6px; padding: 0 12px; font-size: 14px; font-family: inherit"></div>
<div style="display: flex; flex-direction: column; gap: 6px">
<span style="font-size: 12px; font-weight: 700; color: #4A4E55">Cover image <span style="font-weight: 500; color: #5B5F66">— pick a frame or upload one</span></span>
<div style="display: flex; flex-wrap: wrap; gap: 6px">
<sc-for list="{{frames}}" as="fr" hint-placeholder-count="4"><button type="button" aria-label="Frame {{fr.n}}" style="width: {{coverW}}; height: {{coverH}}; border-radius: 4px; border: 2px solid {{fr.ring}}; background: #D9D3C7; cursor: pointer; padding: 0"></button></sc-for>
<button type="button" style="width: {{coverW}}; height: {{coverH}}; border-radius: 4px; border: 1px dashed #C9C4BA; background: #FFFFFF; font-family: inherit; font-size: 20px; color: #4A4E55; cursor: pointer">+</button>
</div>
</div>
</div>
</div>
</div>

<!-- Details -->
<div style="background: #FFFFFF; border: 1px solid #E4DED3; border-radius: 10px; padding: 22px; display: flex; flex-direction: column; gap: 14px">
<span style="font-size: 16px; font-weight: 700">Details</span>
<div style="display: flex; flex-direction: column; gap: 4px"><label for="v-title" style="font-size: 12px; font-weight: 700; color: #4A4E55">Title</label><input id="v-title" type="text" dir="{{dir}}" placeholder="{{phTitle}}" style="height: 46px; border: 1px solid #D9D3C7; border-radius: 6px; padding: 0 14px; font-size: 18px; font-weight: 700; font-family: {{font}}; text-align: {{align}}"></div>
<div style="display: flex; flex-direction: column; gap: 4px"><label for="v-cap" style="font-size: 12px; font-weight: 700; color: #4A4E55">Caption <span style="font-weight: 500; color: #5B5F66">— shown under the video on the site</span></label><textarea id="v-cap" dir="{{dir}}" rows="3" placeholder="{{phCap}}" style="border: 1px solid #D9D3C7; border-radius: 6px; padding: 10px 14px; font-size: 15px; line-height: 1.5; font-family: {{font}}; resize: vertical; text-align: {{align}}"></textarea></div>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">
<div style="display: flex; flex-direction: column; gap: 4px"><label for="v-cat" style="font-size: 12px; font-weight: 700; color: #4A4E55">Section</label><select id="v-cat" style="height: 40px; border: 1px solid #D9D3C7; border-radius: 6px; padding: 0 10px; font-size: 14px; font-family: inherit; background: #FFFFFF"><option>Choose a section</option><option>Business</option><option>Travel</option><option>Tech</option><option>Politics</option><option>Lifestyle</option><option>Report</option><option>Opinion</option></select></div>
<div style="display: flex; flex-direction: column; gap: 4px"><label for="v-tags" style="font-size: 12px; font-weight: 700; color: #4A4E55">Tags</label><input id="v-tags" type="text" placeholder="Type to find or add" style="height: 40px; border: 1px solid #D9D3C7; border-radius: 6px; padding: 0 12px; font-size: 14px; font-family: inherit"></div>
<div style="display: flex; flex-direction: column; gap: 4px"><label for="v-by" style="font-size: 12px; font-weight: 700; color: #4A4E55">Filmed / edited by</label><input id="v-by" type="text" value="[Your name]" style="height: 40px; border: 1px solid #D9D3C7; border-radius: 6px; padding: 0 12px; font-size: 14px; font-family: inherit"></div>
<div style="display: flex; flex-direction: column; gap: 4px"><label for="v-art" style="font-size: 12px; font-weight: 700; color: #4A4E55">Related article <span style="font-weight: 500; color: #5B5F66">(optional)</span></label><input id="v-art" type="text" placeholder="Search articles" style="height: 40px; border: 1px solid #D9D3C7; border-radius: 6px; padding: 0 12px; font-size: 14px; font-family: inherit"></div>
</div>
<div style="display: flex; align-items: center; gap: 12px; padding: 12px 14px; border: 1px solid #E4DED3; border-radius: 8px">
<div style="display: flex; flex-direction: column; flex-grow: 1"><span style="font-size: 14px; font-weight: 700">Subtitles <span style="font-weight: 500; color: #5B5F66">(optional)</span></span><span style="font-size: 12px; color: #5B5F66">Most people watch on social media with the sound off. Upload an .srt file.</span></div>
<button type="button" style="height: 34px; padding: 0 12px; border: 1px solid #D9D3C7; border-radius: 6px; background: #FFFFFF; font-family: inherit; font-weight: 700; font-size: 13px; cursor: pointer">Add file</button>
</div>
</div>
</div>

<!-- Side column -->
<div style="display: flex; flex-direction: column; gap: 14px">

<div style="background: #FFFFFF; border: 1px solid #E4DED3; border-radius: 10px; padding: 18px; display: flex; flex-direction: column; gap: 12px">
<div role="group" aria-label="When to publish" style="display: grid; grid-template-columns: 1fr 1fr; border: 1px solid #D9D3C7; border-radius: 8px; overflow: hidden">
<button type="button" onClick="{{setNow}}" style="height: 38px; border: none; font-family: inherit; font-weight: 700; font-size: 14px; cursor: pointer; background: {{nowBg}}; color: {{nowFg}}">Publish now</button>
<button type="button" onClick="{{setLater}}" style="height: 38px; border: none; font-family: inherit; font-weight: 700; font-size: 14px; cursor: pointer; background: {{laterBg}}; color: {{laterFg}}">Schedule</button>
</div>
<sc-if value="{{isLater}}" hint-placeholder-val="{{false}}">
<div style="display: grid; grid-template-columns: 1fr 120px; gap: 8px">
<div style="display: flex; flex-direction: column; gap: 4px"><label for="v-date" style="font-size: 12px; font-weight: 700; color: #4A4E55">Date</label><input id="v-date" type="date" value="2026-11-19" style="height: 40px; border: 1px solid #D9D3C7; border-radius: 6px; padding: 0 10px; font-size: 14px; font-family: inherit"></div>
<div style="display: flex; flex-direction: column; gap: 4px"><label for="v-time" style="font-size: 12px; font-weight: 700; color: #4A4E55">Time</label><input id="v-time" type="time" value="18:00" style="height: 40px; border: 1px solid #D9D3C7; border-radius: 6px; padding: 0 10px; font-size: 14px; font-family: inherit"></div>
</div>
<span style="font-size: 12px; color: #5B5F66">Maldives time (UTC+5). Site and social posts go out together.</span>
</sc-if>
<button type="button" style="height: 44px; border: none; border-radius: 6px; background: {{accent}}; color: #FFFFFF; font-family: inherit; font-weight: 700; font-size: 15px; cursor: pointer">{{publishLabel}}</button>
<button type="button" style="height: 38px; border: 1px solid #D9D3C7; border-radius: 6px; background: #FFFFFF; font-family: inherit; font-weight: 700; font-size: 14px; cursor: pointer">Save draft</button>
</div>

<div style="background: #FFFFFF; border: 1px solid #E4DED3; border-radius: 10px; padding: 18px; display: flex; flex-direction: column; gap: 10px">
<span style="font-size: 14px; font-weight: 700">On the website</span>
<span style="font-size: 14px; color: #4A4E55">{{placeText}}</span>
<sc-if value="{{isVideo}}" hint-placeholder-val="{{true}}">
<label style="display: flex; align-items: center; gap: 8px; font-size: 14px"><input type="checkbox" style="width: 17px; height: 17px"> Make it the large featured video</label>
</sc-if>
</div>

<div style="background: #FFFFFF; border: 1px solid #E4DED3; border-radius: 10px; padding: 18px; display: flex; flex-direction: column; gap: 12px">
<span style="font-size: 14px; font-weight: 700">Post to social media</span>
<sc-for list="{{platforms}}" as="p" hint-placeholder-count="2">
<div style="display: flex; align-items: center; gap: 10px; padding: 10px 12px; border: 1px solid #E4DED3; border-radius: 8px">
<span style="width: 30px; height: 30px; border-radius: 6px; background: {{p.color}}; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-weight: 800; font-family: Arial, sans-serif; font-size: 15px; flex-shrink: 0">{{p.mark}}</span>
<div style="display: flex; flex-direction: column; flex-grow: 1"><span style="font-size: 14px; font-weight: 700">{{p.name}}</span><span style="font-size: 12px; color: #5B5F66">{{p.as}}</span></div>
<button type="button" role="switch" aria-checked="{{p.on}}" aria-label="Post to {{p.name}}" onClick="{{p.toggle}}" style="width: 40px; height: 22px; border-radius: 999px; border: none; padding: 2px; cursor: pointer; background: {{p.track}}; display: flex; justify-content: {{p.knob}}; flex-shrink: 0"><span style="width: 18px; height: 18px; border-radius: 999px; background: #FFFFFF"></span></button>
</div>
</sc-for>
<div style="display: flex; flex-direction: column; gap: 4px"><label for="v-post" style="font-size: 12px; font-weight: 700; color: #4A4E55">Post text</label><textarea id="v-post" dir="{{dir}}" rows="3" placeholder="Leave empty to use the caption" style="border: 1px solid #D9D3C7; border-radius: 6px; padding: 8px 10px; font-size: 14px; font-family: {{font}}; resize: vertical"></textarea></div>
<div style="display: flex; flex-direction: column; gap: 4px"><label for="v-hash" style="font-size: 12px; font-weight: 700; color: #4A4E55">Hashtags</label><input id="v-hash" type="text" value="#Maldives #Business" style="height: 38px; border: 1px solid #D9D3C7; border-radius: 6px; padding: 0 12px; font-size: 14px; font-family: inherit"></div>
<span style="font-size: 12px; color: #5B5F66">A link back to the site is added automatically. Accounts are connected in Settings → Integrations.</span>
</div>

</div>
</div>
</div>
</div>
</template>
<script>
class Component extends DCLogic {
renderVals() {
const accent = this.props.accent ?? '#C23B22';
const s = this.state || {};
const dv = s.lang === 'DV';
const reel = s.kind === 'Reel';
const later = !!s.later;
const nav = [['Overview','Admin-Overview.html'],['Articles','Admin-Articles.html'],['New article','Admin-Editor.html'],['Upload video','Admin-Video.html'],['Homepage layout','Admin-Homepage.html'],['Media library','Admin-Media.html'],['Statistics','Admin-Stats.html'],['Ads','Admin-Ads.html'],['Comments','Admin-Comments.html'],['Categories & tags','Admin-Categories.html'],['Authors','Admin-Authors.html'],['Users & roles','Admin-Users.html'],['Settings','Admin-Settings.html']];
const active = 'Upload video';
const seg = (on) => ({ bg: on ? '#16181D' : '#FFFFFF', fg: on ? '#FFFFFF' : '#16181D' });
const pf = (key, name, mark, color, asText) => { const on = s[key] !== false; return { name, mark, color, as: asText, on, toggle: () => this.setState({ [key]: !on }), track: on ? accent : '#C9C4BA', knob: on ? 'flex-end' : 'flex-start' }; };
return {
accent,
navItems: nav.map(([label, href]) => ({ label, href, bg: label === active ? '#2A2D34' : 'transparent', fg: label === active ? '#FFFFFF' : '#C9C4BA', bar: label === active ? accent : 'transparent' })),
enBg: seg(!dv).bg, enFg: seg(!dv).fg, dvBg: seg(dv).bg, dvFg: seg(dv).fg,
setEN: () => this.setState({ lang: 'EN' }), setDV: () => this.setState({ lang: 'DV' }),
dir: dv ? 'rtl' : 'ltr', align: dv ? 'right' : 'left',
font: dv ? "Faruma, 'Noto Sans Thaana', sans-serif" : 'inherit',
phTitle: dv ? 'ވީޑިއޯގެ ސުރުޚީ' : 'Video title',
phCap: dv ? 'ވީޑިއޯއާ ބެހޭ ކުރު ތަފްސީލެއް' : 'A short description of the video',
kinds: [['Video', 'Widescreen 16:9 · Videos section', '34px', '20px'], ['Reel', 'Vertical 9:16 · Reels row', '16px', '28px']].map(([label, sub, iw, ih]) => { const on = (label === 'Reel') === reel; return { label, sub, iw, ih, on, pick: () => this.setState({ kind: label }), border: on ? '#16181D' : '#E4DED3', bg: on ? '#FAF8F5' : '#FFFFFF' }; }),
dropW: reel ? '200px' : '340px', dropH: reel ? '356px' : '192px',
coverW: reel ? '36px' : '56px', coverH: reel ? '64px' : '32px',
specTitle: reel ? 'Reel file' : 'Video file',
specs: reel ? ['MP4 or MOV, vertical (1080×1920)', 'Up to 90 seconds works best on all platforms', 'Keep text away from the top and bottom edges'] : ['MP4 or MOV, widescreen (1920×1080)', 'Up to 2 GB', 'Length is read from the file automatically'],
frames: [1, 2, 3, 4].map(n => ({ n, ring: n === 2 ? '#16181D' : 'transparent' })),
isLater: later,
nowBg: seg(!later).bg, nowFg: seg(!later).fg, laterBg: seg(later).bg, laterFg: seg(later).fg,
setNow: () => this.setState({ later: false }), setLater: () => this.setState({ later: true }),
publishLabel: later ? 'Schedule' : 'Publish now',
isVideo: !reel,
placeText: reel ? 'Appears in the Reels row on the homepage and on its section page.' : 'Appears in the Videos section on the homepage and on its section page.',
platforms: [
pf('fb', 'Facebook Page', 'f', '#1877F2', reel ? 'Posts as a Facebook Reel' : 'Posts as a Facebook video'),
pf('x', 'X (Twitter)', 'X', '#000000', reel ? 'Posts the video with the text' : 'Posts a clip if under 2:20, otherwise the link')
]
};
}
}
MBL.boot(Component, {"accent":{"editor":"color","default":"#C23B22"},"$preview":{"width":1440,"height":1400}});
</script>
</body>
</html>
