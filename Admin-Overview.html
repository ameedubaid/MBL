<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1440">
<title>Admin — Overview</title>
<link rel="stylesheet" href="fonts.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700;9..144,800&amp;family=Source+Sans+3:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'Source Sans 3',system-ui,sans-serif;background:#F4F2EE;color:#16181D}
a{color:inherit;text-decoration:none}a:hover{color:#B8361E}
</style>
<script src="mbl-runtime.js"></script>
</head>
<body>
<div id="dc-root"></div>
<template id="dc-template">

<div style="width: 1440px; min-height: 1240px; display: flex; background: #F4F2EE">

<!-- Sidebar -->
<aside style="width: 248px; flex-shrink: 0; background: #16181D; color: #C9C4BA; display: flex; flex-direction: column; gap: 28px; padding: 24px 14px; box-sizing: border-box">
<a href="Admin-Overview.html" style="padding: 0 10px; display: flex; align-items: baseline; gap: 8px">
<span style="font-family: Fraunces, Georgia, serif; font-size: 26px; font-weight: 800; color: #F6F3EE"><img src="logo-white.svg" alt="Maldives Business Ledger" style="display: block; height: 22px; width: auto"></span>
<span style="font-size: 12px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: #8A8F98">Admin</span>
</a>
<nav style="display: flex; flex-direction: column; gap: 2px">
<sc-for list="{{navItems}}" as="n" hint-placeholder-count="13">
<a href="{{n.href}}" style="display: flex; align-items: center; gap: 10px; height: 42px; padding: 0 12px; border-radius: 6px; font-size: 15px; font-weight: 600; background: {{n.bg}}; color: {{n.fg}}; border-left: 3px solid {{n.bar}}">{{n.label}}</a>
</sc-for>
</nav>
<div style="margin-top: auto; display: flex; align-items: center; gap: 10px; padding: 12px 10px; border-top: 1px solid #2A2D34">
<div style="width: 36px; height: 36px; border-radius: 999px; background: #3A3D44"></div>
<div style="display: flex; flex-direction: column"><span style="font-size: 14px; font-weight: 700; color: #F6F3EE">[Your name]</span><span style="font-size: 12px">Editor-in-chief</span></div>
</div>
</aside>

<!-- Main -->
<div style="flex-grow: 1; display: flex; flex-direction: column">
<header style="height: 68px; background: #FFFFFF; border-bottom: 1px solid #E4DED3; display: flex; align-items: center; gap: 20px; padding: 0 32px">
<h1 style="margin: 0; font-size: 22px; font-weight: 700; flex-grow: 1">Overview</h1>
<div role="group" aria-label="Language" style="display: flex; border: 1px solid #D9D3C7; border-radius: 6px; overflow: hidden">
<button type="button" onClick="{{setEN}}" style="height: 36px; padding: 0 14px; border: none; font-family: inherit; font-weight: 700; font-size: 13px; cursor: pointer; background: {{enBg}}; color: {{enFg}}">EN</button>
<button type="button" onClick="{{setDV}}" style="height: 36px; padding: 0 14px; border: none; font-family: inherit; font-weight: 700; font-size: 13px; cursor: pointer; background: {{dvBg}}; color: {{dvFg}}">DV</button>
</div>
<label for="ov-search" style="position: absolute; left: -9999px">Search articles</label>
<input id="ov-search" type="search" placeholder="Search articles, IDs, tags…" style="width: 300px; height: 40px; border: 1px solid #D9D3C7; border-radius: 6px; padding: 0 12px; font-size: 14px; font-family: inherit; background: #FAF9F7">
<a href="Admin-Editor.html" style="height: 40px; padding: 0 18px; border-radius: 6px; background: {{accent}}; color: #FFFFFF; font-weight: 700; font-size: 14px; display: flex; align-items: center">+ New article</a>
</header>

<div style="padding: 28px 32px 40px; display: flex; flex-direction: column; gap: 24px">

<!-- KPI row -->
<div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px">
<sc-for list="{{kpis}}" as="k" hint-placeholder-count="4">
<div style="background: #FFFFFF; border: 1px solid #E4DED3; border-radius: 10px; padding: 18px 20px; display: flex; flex-direction: column; gap: 6px">
<span style="font-size: 12px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: #5B5F66">{{k.label}}</span>
<span style="font-size: 30px; font-weight: 700; line-height: 1.1">{{k.value}}</span>
<span style="font-size: 13px; color: {{k.noteColor}}">{{k.note}}</span>
</div>
</sc-for>
</div>

<!-- Pipeline + traffic -->
<div style="display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 16px">
<div style="grid-column: span 5; background: #FFFFFF; border: 1px solid #E4DED3; border-radius: 10px; padding: 20px; display: flex; flex-direction: column; gap: 14px">
<h2 style="margin: 0; font-size: 16px; font-weight: 700">Publishing pipeline</h2>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">
<sc-for list="{{pipeline}}" as="p" hint-placeholder-count="4">
<a href="Admin-Articles.html" style="border-radius: 8px; background: #F4F2EE; padding: 14px 16px; display: flex; flex-direction: column; gap: 2px">
<span style="font-size: 26px; font-weight: 700; color: {{p.color}}">{{p.value}}</span>
<span style="font-size: 13px; font-weight: 600; color: #4A4E55">{{p.label}}</span>
</a>
</sc-for>
</div>
</div>
<div style="grid-column: span 7; background: #FFFFFF; border: 1px solid #E4DED3; border-radius: 10px; padding: 20px; display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; align-items: center"><h2 style="margin: 0; font-size: 16px; font-weight: 700; flex-grow: 1">Visitors, last 14 days</h2><a href="Admin-Stats.html" style="font-size: 13px; font-weight: 700; color: {{accent}}">Full statistics →</a></div>
<svg width="100%" height="150" viewBox="0 0 640 150" preserveAspectRatio="none" role="img" aria-label="Daily visitors chart">
<line x1="0" y1="149" x2="640" y2="149" stroke="#E4DED3" stroke-width="1"></line>
<line x1="0" y1="100" x2="640" y2="100" stroke="#F0ECE5" stroke-width="1"></line>
<line x1="0" y1="50" x2="640" y2="50" stroke="#F0ECE5" stroke-width="1"></line>
<polyline points="{{chartPts}}" fill="none" stroke="{{accent}}" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"></polyline>
</svg>
<div style="display: flex; justify-content: space-between; font-size: 12px; color: #5B5F66"><span>16 Sep</span><span>22 Sep</span><span>29 Sep</span></div>
</div>
</div>

<!-- Review + Published -->
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px">
<sc-for list="{{lists}}" as="L" hint-placeholder-count="2">
<div style="background: #FFFFFF; border: 1px solid #E4DED3; border-radius: 10px; display: flex; flex-direction: column">
<div style="display: flex; align-items: center; padding: 16px 20px; border-bottom: 1px solid #E4DED3">
<h2 style="margin: 0; font-size: 16px; font-weight: 700; flex-grow: 1">{{L.title}}</h2>
<a href="Admin-Articles.html" style="font-size: 13px; font-weight: 700; color: {{accent}}">View all →</a>
</div>
<sc-for list="{{L.items}}" as="a" hint-placeholder-count="4">
<div style="display: flex; align-items: center; gap: 14px; padding: 14px 20px; border-bottom: 1px solid #F0ECE5">
<div style="width: 64px; height: 48px; flex-shrink: 0; border-radius: 4px; background: {{a.tone}}"></div>
<div style="display: flex; flex-direction: column; gap: 4px; flex-grow: 1">
<span style="font-size: 15px; font-weight: 600; line-height: 1.3">{{a.title}}</span>
<span style="font-size: 12px; color: #5B5F66">#{{a.id}} · {{a.cat}} · {{a.author}} · {{a.time}}</span>
</div>
<span style="font-size: 13px; color: #4A4E55; width: 70px; text-align: right">{{a.views}}</span>
<a href="Admin-Editor.html" aria-label="Edit article" style="width: 36px; height: 36px; border-radius: 6px; border: 1px solid #D9D3C7; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"></path><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"></path></svg></a>
</div>
</sc-for>
</div>
</sc-for>
</div>

</div>
</div>
</div>
</template>
<script>
class Component extends DCLogic {
renderVals() {
const accent = this.props.accent ?? '#C23B22';
const lang = (this.state && this.state.lang) || 'EN';
const nav = [['Overview','Admin-Overview.html'],['Articles','Admin-Articles.html'],['New article','Admin-Editor.html'],['Upload video','Admin-Video.html'],['Homepage layout','Admin-Homepage.html'],['Media library','Admin-Media.html'],['Statistics','Admin-Stats.html'],['Ads','Admin-Ads.html'],['Comments','Admin-Comments.html'],['Categories & tags','Admin-Categories.html'],['Authors','Admin-Authors.html'],['Users & roles','Admin-Users.html'],['Settings','Admin-Settings.html']];
const active = 'Overview';
const v = [22, 25, 21, 24, 19, 23, 27, 26, 22, 20, 24, 29, 31, 28];
const pts = v.map((y, i) => (i * 640 / 13).toFixed(0) + ',' + (145 - (y - 15) * 7).toFixed(0)).join(' ');
return {
accent,
navItems: nav.map(([label, href]) => ({ label, href, bg: label === active ? '#2A2D34' : 'transparent', fg: label === active ? '#FFFFFF' : '#C9C4BA', bar: label === active ? accent : 'transparent' })),
enBg: lang === 'EN' ? '#16181D' : '#FFFFFF', enFg: lang === 'EN' ? '#FFFFFF' : '#16181D',
dvBg: lang === 'DV' ? '#16181D' : '#FFFFFF', dvFg: lang === 'DV' ? '#FFFFFF' : '#16181D',
setEN: () => this.setState({ lang: 'EN' }), setDV: () => this.setState({ lang: 'DV' }),
chartPts: pts,
kpis: [
{ label: 'Visits today', value: '[1,240]', note: '▲ 8% vs yesterday', noteColor: '#1E7A5A' },
{ label: 'Unique visitors (month)', value: '[18,400]', note: 'September 2026', noteColor: '#5B5F66' },
{ label: 'Published this month', value: '[286]', note: '≈ 10 per day', noteColor: '#5B5F66' },
{ label: 'Avg. views per article', value: '[64]', note: '▼ 3% vs last month', noteColor: '#B8361E' }
],
pipeline: [
{ label: 'Drafts', value: '6', color: '#16181D' },
{ label: 'Waiting for review', value: '4', color: '#B3560E' },
{ label: 'Scheduled', value: '2', color: '#1F5FA8' },
{ label: 'Overdue', value: '0', color: '#1E7A5A' }
],
lists: [
{ title: 'Waiting for review', items: [
{ id: '10482', title: 'Council approves car-free weekends for the harbour district', cat: 'Politics', author: 'Aishath N.', time: '12 min ago', views: '—', tone: '#5B3B4A' },
{ id: '10479', title: 'Coffee prices: why small roasters are holding steady', cat: 'Business', author: 'Hassan M.', time: '40 min ago', views: '—', tone: '#5A4636' },
{ id: '10477', title: 'Seven island ferries worth the slow way round', cat: 'Travel', author: 'Mariyam S.', time: '1 hr ago', views: '—', tone: '#2F5A5E' },
{ id: '10471', title: 'Balcony gardens that survive the monsoon', cat: 'Lifestyle', author: 'Ibrahim F.', time: '2 hr ago', views: '—', tone: '#556B4A' }
] },
{ title: 'Recently published', items: [
{ id: '10480', title: 'The quiet towns rebuilding their high streets', cat: 'Report', author: 'Aishath N.', time: '25 min ago', views: '312 views', tone: '#2E3A40' },
{ id: '10476', title: 'What the new housing bill changes for renters', cat: 'Politics', author: 'Hassan M.', time: '1 hr ago', views: '1,084 views', tone: '#5B3B4A' },
{ id: '10474', title: 'Four-day weeks, one year on', cat: 'Business', author: 'Mariyam S.', time: '3 hr ago', views: '690 views', tone: '#6A5343' },
{ id: '10470', title: 'Inside the workshop teaching teenagers to build satellites', cat: 'Tech', author: 'Ibrahim F.', time: '5 hr ago', views: '1,420 views', tone: '#3B4A63' }
] }
]
};
}
}
MBL.boot(Component, {"accent":{"editor":"color","default":"#C23B22"},"$preview":{"width":1440,"height":1240}});
</script>
</body>
</html>
