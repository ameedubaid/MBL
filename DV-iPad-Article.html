<p style="margin: 0; font-size: 20px; line-height: 2">ފަސް އަހަރު ކުރިން ރަށުގެ މައިގަނޑު މަގުގައި ހުރި ފިހާރަތަކުގެ ބައިވަރު ތަނެއް ބަންދުކޮށްފައި ހުރީ. މިއަދު އެ މަގުގައި ބޭކަރީއަކާއި، ސައިކަލު ރިޕެއާކުރާ ތަނަކާއި، ކުޑަ ފޮތް ފިހާރައެއް ހުޅުވިފައި ވެއެވެ.</p>
<p style="margin: 0; font-size: 20px; line-height: 2">މި ބަދަލު އައީ އެއް ބޮޑު މަޝްރޫއަކުން ނޫނެވެ. އާ ވިޔަފާރިވެރިންނަށް ކުރު މުއްދަތުގެ ކުލި ދިނުމާއި، ހަފްތާ ބަންދު ދުވަސްތަކުގައި ބާޒާރު ބޭއްވުމާއި، މަގުގައި ދުއްވާ ބާރުމިން ކުޑަކުރުމުން ކަމަށް ރައްޔިތުން ބުނެއެވެ.</p>

<p style="margin: 0; font-size: 20px; line-height: 2">ޕްލޭނަރުން ދައްކަނީ ތިން ފިލާވަޅު: ފެށުން ލުއިކުރުން، މީހުންނަށް މަޑުކުރަން ރީތި ތަނެއް ހެދުން، އަދި ރައްޔިތުންނަށް ކުރިއަށް ދާން ދިނުން.</p>
