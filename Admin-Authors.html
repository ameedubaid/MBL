<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1440">
<title>Admin — Authors</title>
<link rel="stylesheet" href="fonts.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700;9..144,800&amp;family=Source+Sans+3:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'Source Sans 3',system-ui,sans-serif;background:#F4F2EE;color:#16181D}
a{color:inherit;text-decoration:none}a:hover{color:#B8361E}
</style>
<style>#dc-root>*{margin-left:auto !important;margin-right:auto !important}</style>
<script src="mbl-runtime.js"></script>
</head>
<body>
<div id="dc-root"></div>
<template id="dc-template">

<div style="width: 1440px; min-height: 1180px; display: flex; background: #F4F2EE">

<!-- Sidebar -->
<aside style="width: 248px; flex-shrink: 0; background: #16181D; color: #C9C4BA; display: flex; flex-direction: column; gap: 28px; padding: 24px 14px; box-sizing: border-box">
<a href="Admin-Overview.html" style="padding: 0 10px; display: flex; align-items: baseline; gap: 8px">
<span style="font-family: Fraunces, Georgia, serif; font-size: 26px; font-weight: 800; color: #F6F3EE"><img src="logo-white.svg" alt="Maldives Business Ledger" style="display: block; height: 22px; width: auto"></span>
<span style="font-size: 12px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: #8A8F98">Admin</span>
</a>
<nav style="display: flex; flex-direction: column; gap: 2px">
<sc-for list="{{navItems}}" as="n" hint-placeholder-count="13">
<a href="{{n.href}}" style="display: flex; align-items: center; gap: 10px; height: 42px; padding: 0 12px; border-radius: 6px; font-size: 15px; font-weight: 600; background: {{n.bg}}; color: {{n.fg}}; border-left: 3px solid {{n.bar}}">{{n.label}}</a>
</sc-for>
</nav>
<div style="margin-top: auto; display: flex; align-items: center; gap: 10px; padding: 12px 10px; border-top: 1px solid #2A2D34">
<div style="width: 36px; height: 36px; border-radius: 999px; background: #3A3D44"></div>
<div style="display: flex; flex-direction: column"><span style="font-size: 14px; font-weight: 700; color: #F6F3EE">[Your name]</span><span style="font-size: 12px">Editor-in-chief</span></div>
</div>
</aside>

<div style="flex-grow: 1; display: flex; flex-direction: column">
<header style="height: 68px; background: #FFFFFF; border-bottom: 1px solid #E4DED3; display: flex; align-items: center; gap: 16px; padding: 0 32px">
<div style="display: flex; flex-direction: column; flex-grow: 1"><h1 style="margin: 0; font-size: 22px; font-weight: 700">Authors</h1><span style="font-size: 12px; color: #5B5F66">Public bylines shown on articles — separate from login accounts, so guest writers don’t need one</span></div>
<button type="button" style="height: 40px; padding: 0 18px; border-radius: 6px; border: none; background: {{accent}}; color: #FFFFFF; font-family: inherit; font-weight: 700; font-size: 14px; cursor: pointer">+ New author</button>
</header>

<div style="padding: 24px 32px 40px; display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 24px">

<div style="grid-column: span 7; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; align-content: start">
<sc-for list="{{authors}}" as="a" hint-placeholder-count="6">
<button type="button" onClick="{{a.pick}}" style="display: flex; align-items: center; gap: 14px; padding: 16px; border-radius: 10px; border: 2px solid {{a.ring}}; background: #FFFFFF; font-family: inherit; text-align: left; cursor: pointer">
<span style="width: 56px; height: 56px; border-radius: 999px; background: {{a.tone}}; flex-shrink: 0"></span>
<span style="display: flex; flex-direction: column; gap: 3px; flex-grow: 1">
<span style="font-size: 16px; font-weight: 700; color: #16181D">{{a.name}}</span>
<span style="font-size: 13px; color: #4A4E55">{{a.role}}</span>
<span style="font-size: 12px; color: #5B5F66">{{a.n}} articles · {{a.v}} views this month</span>
</span>
<sc-if value="{{a.guest}}" hint-placeholder-val="{{false}}"><span style="font-size: 11px; font-weight: 700; padding: 3px 8px; border-radius: 999px; background: #ECEAE6; color: #4A4E55">Guest</span></sc-if>
</button>
</sc-for>
</div>

<div style="grid-column: span 5; display: flex; flex-direction: column; gap: 16px">
<div style="background: #FFFFFF; border: 1px solid #E4DED3; border-radius: 10px; padding: 22px; display: flex; flex-direction: column; gap: 14px">
<div style="display: flex; align-items: center; gap: 14px">
<div style="width: 76px; height: 76px; border-radius: 999px; background: {{cur.tone}}"></div>
<div style="display: flex; flex-direction: column; gap: 4px; flex-grow: 1"><span style="font-size: 20px; font-weight: 700">{{cur.name}}</span><button type="button" style="align-self: flex-start; height: 32px; padding: 0 12px; border: 1px solid #D9D3C7; border-radius: 6px; background: #FFFFFF; font-family: inherit; font-weight: 700; font-size: 13px; cursor: pointer">Change photo</button></div>
</div>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">
<div style="display: flex; flex-direction: column; gap: 6px"><label for="au-en" style="font-size: 13px; font-weight: 700; color: #4A4E55">Name (English)</label><input id="au-en" type="text" value="{{cur.name}}" style="height: 42px; border: 1px solid #D9D3C7; border-radius: 6px; padding: 0 12px; font-size: 15px; font-family: inherit"></div>
<div style="display: flex; flex-direction: column; gap: 6px"><label for="au-dv" style="font-size: 13px; font-weight: 700; color: #4A4E55">Name (Dhivehi)</label><input id="au-dv" type="text" dir="rtl" placeholder="Add later" style="height: 42px; border: 1px solid #D9D3C7; border-radius: 6px; padding: 0 12px; font-size: 15px; font-family: inherit"></div>
</div>
<div style="display: flex; flex-direction: column; gap: 6px"><label for="au-role" style="font-size: 13px; font-weight: 700; color: #4A4E55">Title shown under the name</label><input id="au-role" type="text" value="{{cur.role}}" style="height: 42px; border: 1px solid #D9D3C7; border-radius: 6px; padding: 0 12px; font-size: 15px; font-family: inherit"></div>
<div style="display: flex; flex-direction: column; gap: 6px"><label for="au-bio" style="font-size: 13px; font-weight: 700; color: #4A4E55">Short bio <span style="font-weight: 500; color: #5B5F66">— shown on the author page</span></label><textarea id="au-bio" placeholder="Two or three sentences about what they cover" style="height: 84px; border: 1px solid #D9D3C7; border-radius: 6px; padding: 10px 12px; font-size: 15px; font-family: inherit; resize: none"></textarea></div>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">
<div style="display: flex; flex-direction: column; gap: 6px"><label for="au-x" style="font-size: 13px; font-weight: 700; color: #4A4E55">X / Twitter</label><input id="au-x" type="text" placeholder="@handle" style="height: 40px; border: 1px solid #D9D3C7; border-radius: 6px; padding: 0 12px; font-size: 14px; font-family: inherit"></div>
<div style="display: flex; flex-direction: column; gap: 6px"><label for="au-mail" style="font-size: 13px; font-weight: 700; color: #4A4E55">Public email</label><input id="au-mail" type="email" placeholder="Optional" style="height: 40px; border: 1px solid #D9D3C7; border-radius: 6px; padding: 0 12px; font-size: 14px; font-family: inherit"></div>
</div>
<div style="display: flex; flex-direction: column; gap: 6px"><label for="au-acc" style="font-size: 13px; font-weight: 700; color: #4A4E55">Linked login account</label><select id="au-acc" style="height: 42px; border: 1px solid #D9D3C7; border-radius: 6px; padding: 0 10px; font-size: 14px; font-family: inherit; background: #FFFFFF"><option>{{cur.account}}</option><option>None (guest writer)</option></select></div>
<div style="display: flex; gap: 8px"><button type="button" style="height: 42px; padding: 0 20px; border: none; border-radius: 6px; background: #16181D; color: #FFFFFF; font-family: inherit; font-weight: 700; font-size: 14px; cursor: pointer">Save</button><a href="Admin-Articles.html" style="height: 42px; padding: 0 14px; border: 1px solid #D9D3C7; border-radius: 6px; display: flex; align-items: center; font-weight: 700; font-size: 14px">See their articles</a></div>
</div>
</div>

</div>
</div>
</div>
</template>
<script>
class Component extends DCLogic {
renderVals() {
const accent = this.props.accent ?? '#C23B22';
const s = this.state || {};
const cur = s.cur ?? 0;
const nav = [['Overview','Admin-Overview.html'],['Articles','Admin-Articles.html'],['New article','Admin-Editor.html'],['Upload video','Admin-Video.html'],['Homepage layout','Admin-Homepage.html'],['Media library','Admin-Media.html'],['Statistics','Admin-Stats.html'],['Ads','Admin-Ads.html'],['Comments','Admin-Comments.html'],['Categories & tags','Admin-Categories.html'],['Authors','Admin-Authors.html'],['Users & roles','Admin-Users.html'],['Settings','Admin-Settings.html']];
const active = 'Authors';
const data = [
['Aishath N.', 'Senior reporter, Politics', '84', '[12.1k]', '#BDB6A8', false, 'aishath@[domain] (Reporter)'],
['Hassan M.', 'Business editor', '71', '[10.4k]', '#A9B4B9', false, 'hassan@[domain] (Editor)'],
['Mariyam S.', 'Features & travel writer', '58', '[8.9k]', '#C9B8A6', false, 'mariyam@[domain] (Reporter)'],
['Ibrahim F.', 'Tech & science reporter', '44', '[6.2k]', '#B7C2B0', false, 'ibrahim@[domain] (Reporter)'],
['Video team', 'Business Ledger video & podcast', '29', '[4.1k]', '#9FA8B8', false, 'video@[domain] (Contributor)'],
['[Guest writer]', 'Opinion contributor', '6', '[1.3k]', '#D2C4B6', true, 'None (guest writer)']
];
const c = data[cur];
return {
accent,
navItems: nav.map(([label, href]) => ({ label, href, bg: label === active ? '#2A2D34' : 'transparent', fg: label === active ? '#FFFFFF' : '#C9C4BA', bar: label === active ? accent : 'transparent' })),
authors: data.map((d, i) => ({ name: d[0], role: d[1], n: d[2], v: d[3], tone: d[4], guest: d[5], ring: i === cur ? '#16181D' : '#E4DED3', pick: () => this.setState({ cur: i }) })),
cur: { name: c[0], role: c[1], tone: c[4], account: c[6] }
};
}
}
MBL.boot(Component, {"accent":{"editor":"color","default":"#C23B22"},"$preview":{"width":1440,"height":1180}});
</script>
</body>
</html>
