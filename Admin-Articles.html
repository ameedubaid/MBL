<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1440">
<title>Admin — Articles</title>
<link rel="stylesheet" href="fonts.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700;9..144,800&amp;family=Source+Sans+3:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'Source Sans 3',system-ui,sans-serif;background:#F4F2EE;color:#16181D}
a{color:inherit;text-decoration:none}a:hover{color:#B8361E}
</style>
<script src="mbl-runtime.js"></script>
</head>
<body>
<div id="dc-root"></div>
<template id="dc-template">

<div style="width: 1440px; min-height: 1180px; display: flex; background: #F4F2EE">

<!-- Sidebar -->
<aside style="width: 248px; flex-shrink: 0; background: #16181D; color: #C9C4BA; display: flex; flex-direction: column; gap: 28px; padding: 24px 14px; box-sizing: border-box">
<a href="Admin-Overview.html" style="padding: 0 10px; display: flex; align-items: baseline; gap: 8px">
<span style="font-family: Fraunces, Georgia, serif; font-size: 26px; font-weight: 800; color: #F6F3EE"><img src="logo-white.svg" alt="Maldives Business Ledger" style="display: block; height: 22px; width: auto"></span>
<span style="font-size: 12px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: #8A8F98">Admin</span>
</a>
<nav style="display: flex; flex-direction: column; gap: 2px">
<sc-for list="{{navItems}}" as="n" hint-placeholder-count="13">
<a href="{{n.href}}" style="display: flex; align-items: center; gap: 10px; height: 42px; padding: 0 12px; border-radius: 6px; font-size: 15px; font-weight: 600; background: {{n.bg}}; color: {{n.fg}}; border-left: 3px solid {{n.bar}}">{{n.label}}</a>
</sc-for>
</nav>
<div style="margin-top: auto; display: flex; align-items: center; gap: 10px; padding: 12px 10px; border-top: 1px solid #2A2D34">
<div style="width: 36px; height: 36px; border-radius: 999px; background: #3A3D44"></div>
<div style="display: flex; flex-direction: column"><span style="font-size: 14px; font-weight: 700; color: #F6F3EE">[Your name]</span><span style="font-size: 12px">Editor-in-chief</span></div>
</div>
</aside>

<div style="flex-grow: 1; display: flex; flex-direction: column">
<header style="height: 68px; background: #FFFFFF; border-bottom: 1px solid #E4DED3; display: flex; align-items: center; gap: 20px; padding: 0 32px">
<h1 style="margin: 0; font-size: 22px; font-weight: 700; flex-grow: 1">Articles</h1>
<div role="group" aria-label="Language" style="display: flex; border: 1px solid #D9D3C7; border-radius: 6px; overflow: hidden">
<button type="button" onClick="{{setEN}}" style="height: 36px; padding: 0 14px; border: none; font-family: inherit; font-weight: 700; font-size: 13px; cursor: pointer; background: {{enBg}}; color: {{enFg}}">EN</button>
<button type="button" onClick="{{setDV}}" style="height: 36px; padding: 0 14px; border: none; font-family: inherit; font-weight: 700; font-size: 13px; cursor: pointer; background: {{dvBg}}; color: {{dvFg}}">DV</button>
</div>
<a href="Admin-Editor.html" style="height: 40px; padding: 0 18px; border-radius: 6px; background: {{accent}}; color: #FFFFFF; font-weight: 700; font-size: 14px; display: flex; align-items: center">+ New article</a>
</header>

<div style="padding: 24px 32px 40px; display: flex; flex-direction: column; gap: 18px">

<!-- Status tabs -->
<div role="tablist" style="display: flex; gap: 6px; border-bottom: 1px solid #E4DED3">
<sc-for list="{{tabs}}" as="t" hint-placeholder-count="6">
<button type="button" role="tab" onClick="{{t.pick}}" style="height: 44px; padding: 0 16px; border: none; background: transparent; font-family: inherit; font-size: 15px; font-weight: 700; cursor: pointer; color: {{t.fg}}; border-bottom: 3px solid {{t.bar}}; display: flex; align-items: center; gap: 8px">{{t.label}}<span style="font-size: 12px; font-weight: 700; padding: 2px 8px; border-radius: 999px; background: {{t.pillBg}}; color: {{t.pillFg}}">{{t.count}}</span></button>
</sc-for>
</div>

<!-- Filters -->
<div style="display: flex; gap: 12px; align-items: center">
<input type="search" aria-label="Search articles" placeholder="Search by headline, ID or tag…" style="flex-grow: 1; height: 42px; border: 1px solid #D9D3C7; border-radius: 6px; padding: 0 14px; font-size: 15px; font-family: inherit; background: #FFFFFF">
<select aria-label="Category" style="height: 42px; border: 1px solid #D9D3C7; border-radius: 6px; padding: 0 12px; font-size: 14px; font-family: inherit; background: #FFFFFF"><option>All categories</option><option>Politics</option><option>Business</option><option>Lifestyle</option><option>Tech</option><option>Travel</option><option>Report</option><option>Opinion</option></select>
<select aria-label="Author" style="height: 42px; border: 1px solid #D9D3C7; border-radius: 6px; padding: 0 12px; font-size: 14px; font-family: inherit; background: #FFFFFF"><option>All authors</option><option>Aishath N.</option><option>Hassan M.</option><option>Mariyam S.</option><option>Ibrahim F.</option></select>
<select aria-label="Date" style="height: 42px; border: 1px solid #D9D3C7; border-radius: 6px; padding: 0 12px; font-size: 14px; font-family: inherit; background: #FFFFFF"><option>Any time</option><option>Today</option><option>This week</option><option>This month</option></select>
</div>

<!-- Table -->
<div style="background: #FFFFFF; border: 1px solid #E4DED3; border-radius: 10px; overflow: hidden">
<div style="display: grid; grid-template-columns: 76px minmax(0, 1fr) 120px 130px 130px 110px 90px; gap: 16px; padding: 12px 20px; background: #FAF9F7; border-bottom: 1px solid #E4DED3; font-size: 12px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: #5B5F66">
<span></span><span>Headline</span><span>Category</span><span>Author</span><span>Status</span><span>Views</span><span></span>
</div>
<sc-for list="{{rows}}" as="r" hint-placeholder-count="10">
<div style="display: grid; grid-template-columns: 76px minmax(0, 1fr) 120px 130px 130px 110px 90px; gap: 16px; align-items: center; padding: 12px 20px; border-bottom: 1px solid #F0ECE5">
<div style="width: 76px; height: 54px; border-radius: 4px; background: {{r.tone}}"></div>
<div style="display: flex; flex-direction: column; gap: 3px">
<a href="Admin-Editor.html" style="font-size: 15px; font-weight: 600; line-height: 1.3">{{r.title}}</a>
<span style="font-size: 12px; color: #5B5F66">#{{r.id}} · {{r.time}}</span>
</div>
<span style="font-size: 14px">{{r.cat}}</span>
<span style="font-size: 14px">{{r.author}}</span>
<span style="justify-self: start; font-size: 12px; font-weight: 700; padding: 4px 10px; border-radius: 999px; background: {{r.sBg}}; color: {{r.sFg}}">{{r.status}}</span>
<span style="font-size: 14px; color: #4A4E55">{{r.views}}</span>
<div style="display: flex; gap: 6px; justify-content: flex-end">
<a href="#" aria-label="Preview" style="width: 36px; height: 36px; border-radius: 6px; border: 1px solid #D9D3C7; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"></path><circle cx="12" cy="12" r="3"></circle></svg></a>
<a href="Admin-Editor.html" aria-label="Edit" style="width: 36px; height: 36px; border-radius: 6px; border: 1px solid #D9D3C7; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"></path><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"></path></svg></a>
</div>
</div>
</sc-for>
<div style="display: flex; align-items: center; padding: 14px 20px; font-size: 14px; color: #4A4E55">
<span style="flex-grow: 1">Showing 1–10 of [1,248]</span>
<div style="display: flex; gap: 6px">
<a href="#" style="height: 36px; padding: 0 14px; border: 1px solid #D9D3C7; border-radius: 6px; display: flex; align-items: center; font-weight: 600">← Previous</a>
<a href="#" style="height: 36px; padding: 0 14px; border: 1px solid #D9D3C7; border-radius: 6px; display: flex; align-items: center; font-weight: 600">Next →</a>
</div>
</div>
</div>

</div>
</div>
</div>
</template>
<script>
class Component extends DCLogic {
renderVals() {
const accent = this.props.accent ?? '#C23B22';
const s = this.state || {};
const lang = s.lang || 'EN';
const tab = s.tab || 'All';
const nav = [['Overview','Admin-Overview.html'],['Articles','Admin-Articles.html'],['New article','Admin-Editor.html'],['Upload video','Admin-Video.html'],['Homepage layout','Admin-Homepage.html'],['Media library','Admin-Media.html'],['Statistics','Admin-Stats.html'],['Ads','Admin-Ads.html'],['Comments','Admin-Comments.html'],['Categories & tags','Admin-Categories.html'],['Authors','Admin-Authors.html'],['Users & roles','Admin-Users.html'],['Settings','Admin-Settings.html']];
const active = 'Articles';
const st = { Published: ['#E3F1EA', '#1E6B4F'], 'In review': ['#FBEBDD', '#9A4A0C'], Draft: ['#ECEAE6', '#4A4E55'], Scheduled: ['#E2ECF7', '#1F5FA8'] };
const all = [
['10482','Council approves car-free weekends for the harbour district','Politics','Aishath N.','In review','—','12 min ago','#5B3B4A'],
['10481','Night market lights along the waterfront','Lifestyle','Ibrahim F.','Scheduled','—','Tomorrow, 7:00','#5A4636'],
['10480','The quiet towns rebuilding their high streets','Report','Aishath N.','Published','312','25 min ago','#2E3A40'],
['10479','Coffee prices: why small roasters are holding steady','Business','Hassan M.','In review','—','40 min ago','#5A4636'],
['10478','Ep. 12: What makes a high street work','Report','Mariyam S.','Draft','—','Edited 1 hr ago','#34506B'],
['10476','What the new housing bill changes for renters','Politics','Hassan M.','Published','1,084','1 hr ago','#5B3B4A'],
['10474','Four-day weeks, one year on','Business','Mariyam S.','Published','690','3 hr ago','#6A5343'],
['10473','Five questions ahead of the council budget vote','Politics','Aishath N.','Draft','—','Edited 3 hr ago','#4A5A66'],
['10470','Inside the workshop teaching teenagers to build satellites','Tech','Ibrahim F.','Published','1,420','5 hr ago','#3B4A63'],
['10468','A rainy-season packing list','Lifestyle','Mariyam S.','Published','455','6 hr ago','#556B4A']
];
const map = { All: null, Drafts: 'Draft', 'In review': 'In review', Scheduled: 'Scheduled', Published: 'Published' };
const count = (k) => k === 'All' ? all.length : all.filter(r => r[4] === map[k]).length;
const rows = all.filter(r => !map[tab] || r[4] === map[tab]).map(r => ({ id: r[0], title: r[1], cat: r[2], author: r[3], status: r[4], views: r[5], time: r[6], tone: r[7], sBg: st[r[4]][0], sFg: st[r[4]][1] }));
return {
accent,
navItems: nav.map(([label, href]) => ({ label, href, bg: label === active ? '#2A2D34' : 'transparent', fg: label === active ? '#FFFFFF' : '#C9C4BA', bar: label === active ? accent : 'transparent' })),
enBg: lang === 'EN' ? '#16181D' : '#FFFFFF', enFg: lang === 'EN' ? '#FFFFFF' : '#16181D',
dvBg: lang === 'DV' ? '#16181D' : '#FFFFFF', dvFg: lang === 'DV' ? '#FFFFFF' : '#16181D',
setEN: () => this.setState({ lang: 'EN' }), setDV: () => this.setState({ lang: 'DV' }),
tabs: ['All', 'Drafts', 'In review', 'Scheduled', 'Published'].map(k => ({ label: k, count: count(k), pick: () => this.setState({ tab: k }), fg: k === tab ? '#16181D' : '#5B5F66', bar: k === tab ? accent : 'transparent', pillBg: k === tab ? accent : '#ECEAE6', pillFg: k === tab ? '#FFFFFF' : '#4A4E55' })),
rows
};
}
}
MBL.boot(Component, {"accent":{"editor":"color","default":"#C23B22"},"$preview":{"width":1440,"height":1180}});
</script>
</body>
</html>
