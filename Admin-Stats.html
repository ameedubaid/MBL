<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1440">
<title>Admin — Statistics</title>
<link rel="stylesheet" href="fonts.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700;9..144,800&amp;family=Source+Sans+3:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'Source Sans 3',system-ui,sans-serif;background:#F4F2EE;color:#16181D}
a{color:inherit;text-decoration:none}a:hover{color:#B8361E}
</style>
<script src="mbl-runtime.js"></script>
</head>
<body>
<div id="dc-root"></div>
<template id="dc-template">

<div style="width: 1440px; min-height: 1640px; display: flex; background: #F4F2EE">

<!-- Sidebar -->
<aside style="width: 248px; flex-shrink: 0; background: #16181D; color: #C9C4BA; display: flex; flex-direction: column; gap: 28px; padding: 24px 14px; box-sizing: border-box">
<a href="Admin-Overview.html" style="padding: 0 10px; display: flex; align-items: baseline; gap: 8px">
<span style="font-family: Fraunces, Georgia, serif; font-size: 26px; font-weight: 800; color: #F6F3EE"><img src="logo-white.svg" alt="Maldives Business Ledger" style="display: block; height: 22px; width: auto"></span>
<span style="font-size: 12px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: #8A8F98">Admin</span>
</a>
<nav style="display: flex; flex-direction: column; gap: 2px">
<sc-for list="{{navItems}}" as="n" hint-placeholder-count="13">
<a href="{{n.href}}" style="display: flex; align-items: center; gap: 10px; height: 42px; padding: 0 12px; border-radius: 6px; font-size: 15px; font-weight: 600; background: {{n.bg}}; color: {{n.fg}}; border-left: 3px solid {{n.bar}}">{{n.label}}</a>
</sc-for>
</nav>
<div style="margin-top: auto; display: flex; align-items: center; gap: 10px; padding: 12px 10px; border-top: 1px solid #2A2D34">
<div style="width: 36px; height: 36px; border-radius: 999px; background: #3A3D44"></div>
<div style="display: flex; flex-direction: column"><span style="font-size: 14px; font-weight: 700; color: #F6F3EE">[Your name]</span><span style="font-size: 12px">Editor-in-chief</span></div>
</div>
</aside>

<div style="flex-grow: 1; display: flex; flex-direction: column">
<header style="height: 68px; background: #FFFFFF; border-bottom: 1px solid #E4DED3; display: flex; align-items: center; gap: 12px; padding: 0 32px">
<h1 style="margin: 0; font-size: 22px; font-weight: 700; flex-grow: 1">Statistics</h1>
<div role="group" aria-label="Period" style="display: flex; gap: 4px; background: #ECEAE6; border-radius: 8px; padding: 4px">
<sc-for list="{{periods}}" as="p" hint-placeholder-count="4">
<button type="button" onClick="{{p.pick}}" style="height: 32px; padding: 0 12px; border: none; border-radius: 6px; font-family: inherit; font-size: 13px; font-weight: 700; cursor: pointer; background: {{p.bg}}; color: #16181D">{{p.label}}</button>
</sc-for>
</div>
<select aria-label="Author" style="height: 40px; border: 1px solid #D9D3C7; border-radius: 6px; padding: 0 10px; font-family: inherit; font-size: 14px; background: #FFFFFF"><option>All authors</option><option>Aishath N.</option><option>Hassan M.</option><option>Mariyam S.</option><option>Ibrahim F.</option></select>
<select aria-label="Site" style="height: 40px; border: 1px solid #D9D3C7; border-radius: 6px; padding: 0 10px; font-family: inherit; font-size: 14px; background: #FFFFFF"><option>English site</option><option>Dhivehi site</option><option>Both</option></select>
<button type="button" style="height: 40px; padding: 0 14px; border-radius: 6px; border: 1px solid #D9D3C7; background: #FFFFFF; font-family: inherit; font-weight: 700; font-size: 14px; cursor: pointer">Export</button>
</header>

<div style="padding: 24px 32px 40px; display: flex; flex-direction: column; gap: 16px">
<span style="font-size: 13px; color: #5B5F66">Sample figures shown in [brackets] — real numbers come from your analytics once the site is live.</span>

<!-- KPI strip -->
<div style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 12px">
<sc-for list="{{kpis}}" as="k" hint-placeholder-count="5">
<div style="background: #FFFFFF; border: 1px solid #E4DED3; border-radius: 10px; padding: 16px 18px; display: flex; flex-direction: column; gap: 4px">
<span style="font-size: 12px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: #5B5F66">{{k.label}}</span>
<span style="font-size: 28px; font-weight: 700; line-height: 1.1">{{k.value}}</span>
<span style="font-size: 13px; font-weight: 600; color: {{k.c}}">{{k.note}}</span>
</div>
</sc-for>
</div>

<!-- Traffic chart + sources -->
<div style="display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 16px">
<div style="grid-column: span 8; background: #FFFFFF; border: 1px solid #E4DED3; border-radius: 10px; padding: 20px; display: flex; flex-direction: column; gap: 10px">
<h2 style="margin: 0; font-size: 16px; font-weight: 700">Daily unique visitors</h2>
<svg width="100%" height="220" viewBox="0 0 760 220" preserveAspectRatio="none" role="img" aria-label="Daily unique visitors, last 30 days">
<line x1="0" y1="219" x2="760" y2="219" stroke="#E4DED3"></line>
<line x1="0" y1="150" x2="760" y2="150" stroke="#F0ECE5"></line>
<line x1="0" y1="80" x2="760" y2="80" stroke="#F0ECE5"></line>
<polygon points="{{area}}" fill="{{accent}}" fill-opacity="0.08"></polygon>
<polyline points="{{line}}" fill="none" stroke="{{accent}}" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"></polyline>
</svg>
<div style="display: flex; justify-content: space-between; font-size: 12px; color: #5B5F66"><span>1 Sep</span><span>8 Sep</span><span>15 Sep</span><span>22 Sep</span><span>29 Sep</span></div>
</div>
<div style="grid-column: span 4; background: #FFFFFF; border: 1px solid #E4DED3; border-radius: 10px; padding: 20px; display: flex; flex-direction: column; gap: 12px">
<h2 style="margin: 0; font-size: 16px; font-weight: 700">Where readers come from</h2>
<sc-for list="{{sources}}" as="src" hint-placeholder-count="6">
<div style="display: flex; flex-direction: column; gap: 4px">
<div style="display: flex; font-size: 14px"><span style="flex-grow: 1; font-weight: 600">{{src.name}}</span><span style="color: #4A4E55">{{src.pct}}</span></div>
<div style="height: 8px; border-radius: 999px; background: #F0ECE5"><div style="height: 8px; border-radius: 999px; background: #16181D; width: {{src.pct}}"></div></div>
</div>
</sc-for>
</div>
</div>

<!-- Sections / authors / pipeline -->
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px">
<div style="background: #FFFFFF; border: 1px solid #E4DED3; border-radius: 10px; padding: 20px; display: flex; flex-direction: column; gap: 12px">
<h2 style="margin: 0; font-size: 16px; font-weight: 700">Views by section</h2>
<sc-for list="{{sections}}" as="sc" hint-placeholder-count="7">
<div style="display: flex; align-items: center; gap: 10px; font-size: 14px">
<span style="width: 72px; font-weight: 600">{{sc.name}}</span>
<div style="flex-grow: 1; height: 10px; border-radius: 999px; background: #F0ECE5"><div style="height: 10px; border-radius: 999px; background: {{accent}}; width: {{sc.w}}"></div></div>
<span style="width: 52px; text-align: right; color: #4A4E55">{{sc.v}}</span>
</div>
</sc-for>
</div>
<div style="background: #FFFFFF; border: 1px solid #E4DED3; border-radius: 10px; padding: 20px; display: flex; flex-direction: column; gap: 4px">
<h2 style="margin: 0 0 8px; font-size: 16px; font-weight: 700">Top authors</h2>
<div style="display: flex; font-size: 12px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: #5B5F66; padding-bottom: 6px"><span style="flex-grow: 1">Author</span><span style="width: 70px; text-align: right">Articles</span><span style="width: 70px; text-align: right">Views</span></div>
<sc-for list="{{authors}}" as="au" hint-placeholder-count="5">
<div style="display: flex; align-items: center; gap: 10px; font-size: 14px; padding: 8px 0; border-top: 1px solid #F0ECE5">
<div style="width: 30px; height: 30px; border-radius: 999px; background: #D9D3C7"></div>
<span style="flex-grow: 1; font-weight: 600">{{au.name}}</span><span style="width: 60px; text-align: right">{{au.n}}</span><span style="width: 70px; text-align: right; color: #4A4E55">{{au.v}}</span>
</div>
</sc-for>
</div>
<div style="background: #FFFFFF; border: 1px solid #E4DED3; border-radius: 10px; padding: 20px; display: flex; flex-direction: column; gap: 14px">
<h2 style="margin: 0; font-size: 16px; font-weight: 700">Reader reactions</h2>
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
<sc-for list="{{reactions}}" as="r" hint-placeholder-count="3">
<div style="border-radius: 8px; background: #F4F2EE; padding: 12px; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 22px; font-weight: 700">{{r.v}}</span><span style="font-size: 13px; color: #4A4E55">{{r.label}}</span></div>
</sc-for>
</div>
<h2 style="margin: 4px 0 0; font-size: 16px; font-weight: 700">Trending tags</h2>
<div style="display: flex; flex-wrap: wrap; gap: 6px">
<sc-for list="{{tags}}" as="tg" hint-placeholder-count="8">
<span style="font-size: 13px; font-weight: 600; padding: 6px 10px; border-radius: 999px; background: #ECEAE6">{{tg}}</span>
</sc-for>
</div>
</div>
</div>

<!-- Top articles -->
<div style="background: #FFFFFF; border: 1px solid #E4DED3; border-radius: 10px; overflow: hidden">
<div style="display: flex; align-items: center; padding: 16px 20px; border-bottom: 1px solid #E4DED3"><h2 style="margin: 0; font-size: 16px; font-weight: 700; flex-grow: 1">Top articles</h2><span style="font-size: 13px; color: #5B5F66">Views · average time on page</span></div>
<sc-for list="{{top}}" as="t" hint-placeholder-count="8">
<div style="display: grid; grid-template-columns: 40px 64px minmax(0, 1fr) 120px 110px 100px 70px; gap: 14px; align-items: center; padding: 10px 20px; border-bottom: 1px solid #F0ECE5; font-size: 14px">
<span style="font-size: 18px; font-weight: 700; color: #8A8F98">{{t.n}}</span>
<div style="width: 64px; height: 44px; border-radius: 4px; background: {{t.tone}}"></div>
<span style="font-weight: 600">{{t.title}}</span>
<span style="color: #4A4E55">{{t.author}}</span>
<span style="font-weight: 700">{{t.views}}</span>
<span style="color: #4A4E55">{{t.time}}</span>
<a href="Admin-Editor.html" style="font-weight: 700; color: {{accent}}">Edit</a>
</div>
</sc-for>
</div>

</div>
</div>
</div>
</template>
<script>
class Component extends DCLogic {
renderVals() {
const accent = this.props.accent ?? '#C23B22';
const s = this.state || {};
const period = s.period || '30 days';
const nav = [['Overview','Admin-Overview.html'],['Articles','Admin-Articles.html'],['New article','Admin-Editor.html'],['Upload video','Admin-Video.html'],['Homepage layout','Admin-Homepage.html'],['Media library','Admin-Media.html'],['Statistics','Admin-Stats.html'],['Ads','Admin-Ads.html'],['Comments','Admin-Comments.html'],['Categories & tags','Admin-Categories.html'],['Authors','Admin-Authors.html'],['Users & roles','Admin-Users.html'],['Settings','Admin-Settings.html']];
const active = 'Statistics';
const v = [52,48,55,60,58,50,46,62,66,64,59,57,70,74,68,63,61,72,78,75,69,66,80,84,79,73,70,82,88,85];
const pts = v.map((y, i) => [(i * 760 / 29).toFixed(0), (215 - (y - 40) * 3.6).toFixed(0)]);
const line = pts.map(p => p.join(',')).join(' ');
return {
accent,
navItems: nav.map(([label, href]) => ({ label, href, bg: label === active ? '#2A2D34' : 'transparent', fg: label === active ? '#FFFFFF' : '#C9C4BA', bar: label === active ? accent : 'transparent' })),
periods: ['Today', '7 days', '30 days', 'Custom'].map(p => ({ label: p, pick: () => this.setState({ period: p }), bg: p === period ? '#FFFFFF' : 'transparent' })),
line, area: '0,219 ' + line + ' 760,219',
kpis: [
{ label: 'Unique visitors', value: '[18,400]', note: '▲ 12% vs last period', c: '#1E7A5A' },
{ label: 'Page views', value: '[52,500]', note: '▲ 9%', c: '#1E7A5A' },
{ label: 'Articles published', value: '[286]', note: '≈ 10 per day', c: '#5B5F66' },
{ label: 'Avg. time on article', value: '[1m 48s]', note: '▲ 6s', c: '#1E7A5A' },
{ label: 'Avg. views / article', value: '[64]', note: '▼ 3%', c: '#B8361E' }
],
sources: [
{ name: 'Direct', pct: '34%' }, { name: 'Facebook', pct: '26%' }, { name: 'Google Search', pct: '18%' },
{ name: 'News apps / aggregators', pct: '12%' }, { name: 'X (Twitter)', pct: '6%' }, { name: 'Other', pct: '4%' }
],
sections: [
{ name: 'Politics', w: '100%', v: '[14.2k]' }, { name: 'Business', w: '72%', v: '[10.2k]' }, { name: 'Lifestyle', w: '55%', v: '[7.8k]' },
{ name: 'Report', w: '48%', v: '[6.8k]' }, { name: 'Tech', w: '37%', v: '[5.3k]' }, { name: 'Travel', w: '26%', v: '[3.7k]' }, { name: 'Opinion', w: '19%', v: '[2.7k]' }
],
authors: [
{ name: 'Aishath N.', n: '84', v: '[12.1k]' }, { name: 'Hassan M.', n: '71', v: '[10.4k]' }, { name: 'Mariyam S.', n: '58', v: '[8.9k]' },
{ name: 'Ibrahim F.', n: '44', v: '[6.2k]' }, { name: 'Video team', n: '29', v: '[4.1k]' }
],
reactions: [{ v: '[640]', label: 'Likes' }, { v: '[210]', label: 'Loves' }, { v: '[190]', label: 'Comments' }],
tags: ['Housing bill', 'Harbour', 'Parliament', 'Coffee', 'Ferries', 'Budget 2027', 'Monsoon', 'Football'],
top: [
{ n: '1', title: 'What the new housing bill changes for renters', author: 'Hassan M.', views: '[1,480]', time: '2m 10s', tone: '#5B3B4A' },
{ n: '2', title: 'Inside the workshop teaching teenagers to build satellites', author: 'Ibrahim F.', views: '[1,420]', time: '2m 32s', tone: '#3B4A63' },
{ n: '3', title: 'The quiet towns rebuilding their high streets', author: 'Aishath N.', views: '[1,190]', time: '3m 05s', tone: '#2E3A40' },
{ n: '4', title: 'Why small roasters are winning the coffee price war', author: 'Hassan M.', views: '[960]', time: '1m 44s', tone: '#5A4636' },
{ n: '5', title: 'Four-day weeks, one year on', author: 'Mariyam S.', views: '[890]', time: '1m 58s', tone: '#6A5343' },
{ n: '6', title: 'Seven island ferries worth the slow way round', author: 'Mariyam S.', views: '[740]', time: '2m 20s', tone: '#2F5A5E' },
{ n: '7', title: 'Balcony gardens that survive the monsoon', author: 'Ibrahim F.', views: '[610]', time: '1m 36s', tone: '#556B4A' },
{ n: '8', title: 'Five questions ahead of the council budget vote', author: 'Aishath N.', views: '[580]', time: '1m 50s', tone: '#4A5A66' }
]
};
}
}
MBL.boot(Component, {"accent":{"editor":"color","default":"#C23B22"},"$preview":{"width":1440,"height":1640}});
</script>
</body>
</html>
