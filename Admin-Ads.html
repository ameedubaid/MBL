<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1440">
<title>Admin — Ads</title>
<link rel="stylesheet" href="fonts.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700;9..144,800&amp;family=Source+Sans+3:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'Source Sans 3',system-ui,sans-serif;background:#F4F2EE;color:#16181D}
a{color:inherit;text-decoration:none}a:hover{color:#B8361E}
</style>
<style>#dc-root>*{margin-left:auto !important;margin-right:auto !important}</style>
<script src="mbl-runtime.js"></script>
</head>
<body>
<div id="dc-root"></div>
<template id="dc-template">

<div style="width: 1440px; min-height: 1300px; display: flex; background: #F4F2EE">

<!-- Sidebar -->
<aside style="width: 248px; flex-shrink: 0; background: #16181D; color: #C9C4BA; display: flex; flex-direction: column; gap: 28px; padding: 24px 14px; box-sizing: border-box">
<a href="Admin-Overview.html" style="padding: 0 10px; display: flex; align-items: baseline; gap: 8px">
<span style="font-family: Fraunces, Georgia, serif; font-size: 26px; font-weight: 800; color: #F6F3EE"><img src="logo-white.svg" alt="Maldives Business Ledger" style="display: block; height: 22px; width: auto"></span>
<span style="font-size: 12px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: #8A8F98">Admin</span>
</a>
<nav style="display: flex; flex-direction: column; gap: 2px">
<sc-for list="{{navItems}}" as="n" hint-placeholder-count="13">
<a href="{{n.href}}" style="display: flex; align-items: center; gap: 10px; height: 42px; padding: 0 12px; border-radius: 6px; font-size: 15px; font-weight: 600; background: {{n.bg}}; color: {{n.fg}}; border-left: 3px solid {{n.bar}}">{{n.label}}</a>
</sc-for>
</nav>
<div style="margin-top: auto; display: flex; align-items: center; gap: 10px; padding: 12px 10px; border-top: 1px solid #2A2D34">
<div style="width: 36px; height: 36px; border-radius: 999px; background: #3A3D44"></div>
<div style="display: flex; flex-direction: column"><span style="font-size: 14px; font-weight: 700; color: #F6F3EE">[Your name]</span><span style="font-size: 12px">Editor-in-chief</span></div>
</div>
</aside>

<div style="flex-grow: 1; display: flex; flex-direction: column">
<header style="height: 68px; background: #FFFFFF; border-bottom: 1px solid #E4DED3; display: flex; align-items: center; gap: 16px; padding: 0 32px">
<h1 style="margin: 0; font-size: 22px; font-weight: 700; flex-grow: 1">Ads</h1>
<div style="display: flex; gap: 18px; font-size: 14px">
<span><b>5</b> running</span><span><b>2</b> scheduled</span><span style="color: #9A4A0C"><b>1</b> ends this week</span>
</div>
<button type="button" style="height: 40px; padding: 0 18px; border-radius: 6px; border: none; background: {{accent}}; color: #FFFFFF; font-family: inherit; font-weight: 700; font-size: 14px; cursor: pointer">+ New campaign</button>
</header>

<div style="padding: 24px 32px 40px; display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 24px">

<!-- Slot list grouped by page -->
<div style="grid-column: span 4; display: flex; flex-direction: column; gap: 16px">
<sc-for list="{{groups}}" as="g" hint-placeholder-count="4">
<div style="display: flex; flex-direction: column; gap: 8px">
<span style="font-size: 12px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: #5B5F66">{{g.page}}</span>
<sc-for list="{{g.slots}}" as="sl" hint-placeholder-count="3">
<div style="display: flex; align-items: center; gap: 10px; padding: 0 12px 0 0; border-radius: 10px; border: 2px solid {{sl.ring}}; background: {{sl.cardBg}}">
<button type="button" onClick="{{sl.pick}}" style="display: flex; align-items: center; gap: 12px; padding: 12px; border: none; background: transparent; font-family: inherit; text-align: left; cursor: pointer; flex-grow: 1; opacity: {{sl.fade}}">
<span style="width: 14px; height: 40px; border-radius: 4px; background: {{sl.color}}; flex-shrink: 0"></span>
<span style="display: flex; flex-direction: column; gap: 2px; flex-grow: 1">
<span style="font-size: 15px; font-weight: 700; color: #16181D">{{sl.name}}</span>
<span style="font-size: 12px; color: #5B5F66">{{sl.size}}</span>
</span>
<span style="font-size: 12px; font-weight: 700; padding: 3px 9px; border-radius: 999px; background: {{sl.pBg}}; color: {{sl.pFg}}">{{sl.pill}}</span>
</button>
<button type="button" role="switch" aria-checked="{{sl.on}}" aria-label="{{sl.name}} on or off" onClick="{{sl.toggle}}" style="width: 40px; height: 22px; border-radius: 999px; border: none; padding: 2px; cursor: pointer; background: {{sl.track}}; display: flex; justify-content: {{sl.knob}}; flex-shrink: 0"><span style="width: 18px; height: 18px; border-radius: 999px; background: #FFFFFF; box-shadow: 0 1px 2px rgba(0,0,0,0.25)"></span></button>
</div>
</sc-for>
</div>
</sc-for>
</div>

<!-- Selected slot -->
<div style="grid-column: span 8; display: flex; flex-direction: column; gap: 16px">
<div style="background: #FFFFFF; border: 1px solid #E4DED3; border-radius: 10px; padding: 22px; display: flex; gap: 22px">
<div style="width: 150px; flex-shrink: 0; border: 1px solid #E4DED3; border-radius: 8px; padding: 8px; display: flex; flex-direction: column; gap: 4px; background: #FAF9F7">
<sc-for list="{{mini}}" as="mm" hint-placeholder-count="8">
<div style="height: {{mm.h}}; border-radius: 2px; background: {{mm.bg}}"></div>
</sc-for>
<span style="font-size: 11px; color: #5B5F66; text-align: center; padding-top: 4px">Position on page</span>
</div>
<div style="display: flex; flex-direction: column; gap: 12px; flex-grow: 1">
<div style="display: flex; align-items: center; gap: 10px"><span style="width: 14px; height: 14px; border-radius: 4px; background: {{cur.color}}"></span><h2 style="margin: 0; font-size: 22px; font-weight: 700; flex-grow: 1">{{cur.name}}</h2><a href="{{cur.previewHref}}" style="font-size: 13px; font-weight: 700; color: {{accent}}">See it on the page →</a></div>
<span style="font-size: 14px; color: #4A4E55">{{cur.where}}</span>
<div style="display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 8px; background: {{cur.stBg}}">
<button type="button" role="switch" aria-checked="{{cur.on}}" aria-label="Turn {{cur.name}} on or off" onClick="{{cur.toggle}}" style="width: 44px; height: 24px; border-radius: 999px; border: none; padding: 2px; cursor: pointer; background: {{cur.track}}; display: flex; justify-content: {{cur.knob}}; flex-shrink: 0"><span style="width: 20px; height: 20px; border-radius: 999px; background: #FFFFFF; box-shadow: 0 1px 2px rgba(0,0,0,0.25)"></span></button>
<div style="display: flex; flex-direction: column; gap: 1px; flex-grow: 1"><span style="font-size: 14px; font-weight: 700">{{cur.stTitle}}</span><span style="font-size: 12px; color: #4A4E55">{{cur.stText}}</span></div>
</div>
<sc-if value="{{cur.on}}" hint-placeholder-val="{{true}}">
<div style="display: flex; align-items: center; gap: 10px; font-size: 13px"><label for="ad-empty" style="font-weight: 700; color: #4A4E55">When no ad is running</label><select id="ad-empty" style="height: 34px; border: 1px solid #D9D3C7; border-radius: 6px; padding: 0 8px; font-family: inherit; font-size: 13px; background: #FFFFFF"><option>Hide the slot automatically</option><option>Show “Advertise with us”</option></select></div>
</sc-if>
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px">
<sc-for list="{{cur.devices}}" as="d" hint-placeholder-count="3">
<div style="border-radius: 8px; background: #F4F2EE; padding: 10px 12px; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 12px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: #5B5F66">{{d.dev}}</span><span style="font-size: 15px; font-weight: 700">{{d.size}}</span></div>
</sc-for>
</div>
<span style="font-size: 13px; color: #4A4E55">Upload one file at the desktop size. It resizes itself for iPad and phone. JPEG, PNG, GIF or WebP · 512 KB max.</span>
</div>
</div>

<div style="background: #FFFFFF; border: 1px solid #E4DED3; border-radius: 10px; overflow: hidden">
<div style="display: flex; align-items: center; gap: 12px; padding: 16px 20px; border-bottom: 1px solid #E4DED3">
<h2 style="margin: 0; font-size: 16px; font-weight: 700; flex-grow: 1">Campaigns in this slot</h2>
<label for="ad-rot" style="font-size: 13px; color: #4A4E55">When several run together</label>
<select id="ad-rot" style="height: 36px; border: 1px solid #D9D3C7; border-radius: 6px; padding: 0 8px; font-family: inherit; font-size: 13px"><option>Rotate equally</option><option>Show by priority</option></select>
</div>
<div style="display: grid; grid-template-columns: 56px minmax(0, 1fr) 150px 40px 110px 64px 40px; gap: 14px; padding: 10px 20px; background: #FAF9F7; font-size: 12px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: #5B5F66">
<span></span><span>Advertiser</span><span>Dates</span><span>Site</span><span>Status</span><span>Clicks</span><span></span>
</div>
<sc-for list="{{cur.campaigns}}" as="c" hint-placeholder-count="3">
<div style="display: grid; grid-template-columns: 56px minmax(0, 1fr) 150px 40px 110px 64px 40px; gap: 14px; align-items: center; padding: 12px 20px; border-top: 1px solid #F0ECE5; font-size: 14px">
<div style="width: 64px; height: 36px; border-radius: 4px; background: {{cur.color}}; opacity: 0.85"></div>
<span style="font-weight: 700">{{c.who}}</span>
<span style="color: #4A4E55">{{c.dates}}</span>
<span>{{c.site}}</span>
<span style="justify-self: start; font-size: 12px; font-weight: 700; padding: 4px 10px; border-radius: 999px; background: {{c.sBg}}; color: {{c.sFg}}">{{c.status}}</span>
<span style="color: #4A4E55">{{c.clicks}}</span>
<a href="#" style="font-weight: 700; color: {{accent}}">Edit</a>
</div>
</sc-for>
<sc-if value="{{cur.empty}}" hint-placeholder-val="{{false}}">
<div style="padding: 28px 20px; text-align: center; font-size: 14px; color: #4A4E55; border-top: 1px solid #F0ECE5">No campaigns yet. Until one is added, the slot stays hidden or shows “Advertise with us”, depending on the setting above.</div>
</sc-if>
</div>

<!-- New campaign form -->
<div style="background: #FFFFFF; border: 1px solid #E4DED3; border-radius: 10px; padding: 22px; display: flex; flex-direction: column; gap: 14px">
<h2 style="margin: 0; font-size: 16px; font-weight: 700">Add a campaign to {{cur.name}}</h2>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px">
<div style="display: flex; flex-direction: column; gap: 6px"><label for="nc-who" style="font-size: 13px; font-weight: 700; color: #4A4E55">Advertiser</label><input id="nc-who" type="text" placeholder="Company name" style="height: 42px; border: 1px solid #D9D3C7; border-radius: 6px; padding: 0 12px; font-size: 14px; font-family: inherit"></div>
<div style="display: flex; flex-direction: column; gap: 6px"><label for="nc-url" style="font-size: 13px; font-weight: 700; color: #4A4E55">Link when clicked</label><input id="nc-url" type="url" placeholder="https://" style="height: 42px; border: 1px solid #D9D3C7; border-radius: 6px; padding: 0 12px; font-size: 14px; font-family: inherit"></div>
<div style="display: flex; flex-direction: column; gap: 6px"><label for="nc-start" style="font-size: 13px; font-weight: 700; color: #4A4E55">Starts</label><input id="nc-start" type="date" style="height: 42px; border: 1px solid #D9D3C7; border-radius: 6px; padding: 0 12px; font-size: 14px; font-family: inherit"></div>
<div style="display: flex; flex-direction: column; gap: 6px"><label for="nc-end" style="font-size: 13px; font-weight: 700; color: #4A4E55">Ends <span style="font-weight: 500; color: #5B5F66">— the ad stops automatically</span></label><input id="nc-end" type="date" style="height: 42px; border: 1px solid #D9D3C7; border-radius: 6px; padding: 0 12px; font-size: 14px; font-family: inherit"></div>
</div>
<div style="display: grid; grid-template-columns: 280px minmax(0, 1fr); gap: 18px; align-items: stretch">
<div style="border: 2px dashed #C9C4BA; border-radius: 10px; background: #FAF8F5; padding: 18px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; text-align: center; color: #4A4E55">
<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16V4"></path><path d="M7 9l5-5 5 5"></path><path d="M4 20h16"></path></svg>
<span style="font-size: 15px; font-weight: 700; color: #16181D">Drop your ad file</span>
<span style="font-size: 13px">One file · {{upSize}} px</span>
<span style="font-size: 12px; color: #5B5F66">For extra-sharp screens, upload it at double size ({{upSize2}}).</span>
</div>
<div style="border: 1px solid #E4DED3; border-radius: 10px; padding: 14px 16px; display: flex; flex-direction: column; gap: 12px">
<span style="font-size: 13px; font-weight: 700; color: #4A4E55">How it adjusts on each screen</span>
<sc-for list="{{fits}}" as="ft" hint-placeholder-count="3">
<div style="display: grid; grid-template-columns: 64px minmax(0, 1fr) 96px; gap: 10px; align-items: center">
<span style="font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: #5B5F66">{{ft.dev}}</span>
<div style="display: flex; align-items: center; min-width: 0; overflow: hidden"><div style="flex-shrink: 0; width: {{ft.w}}; height: {{ft.h}}; border-radius: 3px; background: {{cur.color}}; opacity: 0.85"></div></div>
<span style="font-size: 12px; color: #4A4E55; text-align: right">{{ft.size}}</span>
</div>
</sc-for>
<span style="font-size: 12px; color: #5B5F66">The ad keeps its shape and scales down to fit, so nothing gets cropped or stretched.</span>
</div>
</div>
<label style="display: flex; align-items: center; gap: 8px; font-size: 14px"><input type="checkbox" onChange="{{toggleAlt}}" style="width: 17px; height: 17px"> Use a different image on phones <span style="color: #5B5F66">(optional, when the text gets too small)</span></label>
<sc-if value="{{showAlt}}" hint-placeholder-val="{{false}}">
<div style="border: 2px dashed #D9D3C7; border-radius: 8px; padding: 12px 14px; display: flex; align-items: center; gap: 12px; font-size: 13px; color: #4A4E55"><span style="font-weight: 700; color: #16181D">Phone image</span><span style="flex-grow: 1">{{altSize}} px, used only on phones</span><a href="#" style="font-weight: 700; color: {{accent}}">Choose file</a></div>
</sc-if>
<div style="display: flex; flex-direction: column; gap: 10px; padding: 14px 16px; border-radius: 8px; background: #F4F2EE">
<span style="font-size: 13px; font-weight: 700; color: #4A4E55">Label above the ad</span>
<div style="display: flex; align-items: center; gap: 12px; flex-wrap: wrap">
<span style="font-size: 11px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: #5B5F66; padding: 6px 10px; border-radius: 4px; background: #FFFFFF">Advertisement · [Advertiser]</span>
<span dir="rtl" style="font-family: Faruma, 'Noto Sans Thaana', sans-serif; font-size: 13px; color: #5B5F66; padding: 4px 10px; border-radius: 4px; background: #FFFFFF">އިޢުލާން · [ފަރާތުގެ ނަން]</span>
</div>
<label style="display: flex; align-items: center; gap: 8px; font-size: 14px"><input type="checkbox" checked style="width: 17px; height: 17px"> Show the advertiser’s name <span style="color: #5B5F66">(untick to show just “Advertisement”)</span></label>
<div style="display: flex; flex-direction: column; gap: 4px; max-width: 360px"><label for="nc-dvname" style="font-size: 12px; font-weight: 700; color: #4A4E55">Advertiser name in Dhivehi <span style="font-weight: 500; color: #5B5F66">— for the Dhivehi site</span></label><input id="nc-dvname" type="text" dir="rtl" style="height: 38px; border: 1px solid #D9D3C7; border-radius: 6px; padding: 0 12px; font-size: 14px; font-family: Faruma, 'Noto Sans Thaana', sans-serif; background: #FFFFFF"></div>
</div>
<div style="display: flex; align-items: center; gap: 18px; font-size: 14px">
<span style="font-weight: 700; color: #4A4E55">Show on</span>
<label style="display: flex; align-items: center; gap: 6px"><input type="checkbox" checked style="width: 18px; height: 18px"> English site</label>
<label style="display: flex; align-items: center; gap: 6px"><input type="checkbox" style="width: 18px; height: 18px"> Dhivehi site</label>
<span style="flex-grow: 1"></span>
<button type="button" style="height: 42px; padding: 0 20px; border: none; border-radius: 6px; background: #16181D; color: #FFFFFF; font-family: inherit; font-weight: 700; font-size: 14px; cursor: pointer">Save campaign</button>
</div>
</div>

</div>
</div>
</div>
</div>
</template>
<script>
class Component extends DCLogic {
renderVals() {
const accent = this.props.accent ?? '#C23B22';
const s = this.state || {};
const curKey = s.cur || 'top';
const nav = [['Overview','Admin-Overview.html'],['Articles','Admin-Articles.html'],['New article','Admin-Editor.html'],['Upload video','Admin-Video.html'],['Homepage layout','Admin-Homepage.html'],['Media library','Admin-Media.html'],['Statistics','Admin-Stats.html'],['Ads','Admin-Ads.html'],['Comments','Admin-Comments.html'],['Categories & tags','Admin-Categories.html'],['Authors','Admin-Authors.html'],['Users & roles','Admin-Users.html'],['Settings','Admin-Settings.html']];
const active = 'Ads';
const ST = { Running: ['#E3F1EA', '#1E6B4F'], Scheduled: ['#E2ECF7', '#1F5FA8'], 'Ends in 3 days': ['#FBEBDD', '#9A4A0C'], Ended: ['#ECEAE6', '#4A4E55'] };
const camp = (who, dates, site, status, clicks) => ({ who, dates, site, status, clicks, sBg: ST[status][0], sFg: ST[status][1] });
const fit = (w, h, tw, mw) => [[ 'Desktop', w ], [ 'iPad', tw ], [ 'Phone', mw ]].map(([dev, dw]) => { const dh = Math.round(h * dw / w); return { dev, dw, dh, size: dw + ' × ' + dh }; });
const wide = () => fit(1280, 120, 770, 358);
const slots = {
top: { name: 'Top Banner', page: 'All pages', color: '#6FB9DA', where: 'Very top of every page, above the logo.', devices: wide(), mini: 0, href: 'Main.html',
campaigns: [camp('[Advertiser A]', '1 Sep – 31 Dec 2026', 'EN', 'Running', '[1,204]'), camp('[Advertiser B]', '26 Sep – 2 Oct 2026', 'EN', 'Ends in 3 days', '[310]')] },
main: { name: 'Main Container Banner', page: 'Home page', color: '#A6C152', where: 'Home page, under the editor’s picks.', devices: wide(), mini: 3, href: 'Main.html',
campaigns: [camp('[Advertiser C]', '15 Sep – 15 Nov 2026', 'EN', 'Running', '[640]')] },
mid: { name: 'Mid Scrapper', page: 'Home page', color: '#B0714A', where: 'Home page sidebar, next to Latest stories.', devices: fit(395, 340, 370, 300), mini: 4, href: 'Main.html',
campaigns: [camp('[Advertiser D]', '1 Oct – 31 Oct 2026', 'EN', 'Scheduled', '—')] },
gallery: { name: 'Gallery Banner', page: 'Home page', color: '#9A4B83', where: 'Home page, just above Videos.', devices: wide(), mini: 6, href: 'Main.html', campaigns: [] },
inart: { name: 'In-Article Ad', page: 'Article pages', color: '#7A5A92', where: 'Inside the story, after the 2nd paragraph.', devices: fit(300, 250, 300, 300), mini: 2, href: 'Article.html',
campaigns: [camp('[Advertiser E]', '1 Sep – 30 Nov 2026', 'EN', 'Running', '[980]')] },
comment: { name: 'Comment Section Ad', page: 'Article pages', color: '#5A6399', where: 'Just above the comments.', devices: wide(), mini: 5, href: 'Article.html',
campaigns: [camp('[Advertiser G]', '1 Aug – 31 Aug 2026', 'EN', 'Ended', '[212]')] },
sub: { name: 'Sub-Page Banner', page: 'Category pages', color: '#62A866', where: 'Category pages, between the top stories and the list.', devices: wide(), mini: 3, href: 'Category.html',
campaigns: [camp('[Advertiser H]', '1 Oct – 31 Dec 2026', 'EN', 'Scheduled', '—'), camp('[Advertiser C]', '15 Sep – 15 Nov 2026', 'EN', 'Running', '[270]')] }
};
const order = [['All pages', ['top']], ['Home page', ['main', 'mid', 'gallery']], ['Article pages', ['inart', 'comment']], ['Category pages', ['sub']]];
const pill = (sl) => { const r = sl.campaigns.filter(c => c.status === 'Running' || c.status === 'Ends in 3 days').length; return r ? [r + ' running', '#E3F1EA', '#1E6B4F'] : sl.campaigns.some(c => c.status === 'Scheduled') ? ['Scheduled', '#E2ECF7', '#1F5FA8'] : ['Empty', '#ECEAE6', '#4A4E55']; };
const isOn = (k) => (s.off || {})[k] === undefined ? k !== 'gallery' : !(s.off || {})[k];
const flip = (k) => () => this.setState({ off: { ...(s.off || {}), [k]: isOn(k) } });
const sw = (on) => ({ track: on ? accent : '#C9C4BA', knob: on ? 'flex-end' : 'flex-start' });
const c = slots[curKey];
const curOn = isOn(curKey);
const rows = ['38px', '12px', '26px', '12px', '30px', '12px', '26px', '16px'];
return {
accent,
navItems: nav.map(([label, href]) => ({ label, href, bg: label === active ? '#2A2D34' : 'transparent', fg: label === active ? '#FFFFFF' : '#C9C4BA', bar: label === active ? accent : 'transparent' })),
groups: order.map(([page, keys]) => ({ page, slots: keys.map(k => { const sl = slots[k]; const on = isOn(k); const p = on ? pill(sl) : ['Off', '#ECEAE6', '#5B5F66']; return { on, toggle: flip(k), ...sw(on), cardBg: on ? '#FFFFFF' : '#F4F2EE', fade: on ? 1 : 0.6, name: sl.name, color: sl.color, size: sl.devices[0].size + ' desktop', ring: k === curKey ? '#16181D' : '#E4DED3', pill: p[0], pBg: p[1], pFg: p[2], pick: () => this.setState({ cur: k }) }; }) })),
mini: rows.map((h, i) => ({ h, bg: i === c.mini ? (curOn ? c.color : '#C9C4BA') : '#E4DED3' })),
cur: { on: curOn, toggle: flip(curKey), ...sw(curOn), stBg: curOn ? '#E3F1EA' : '#F4F2EE', stTitle: curOn ? 'Slot is on' : 'Slot is off', stText: curOn ? 'Shown on the site wherever it appears.' : 'Hidden on the site. The page closes up, so there is no empty gap. Campaigns are kept.', name: c.name, color: c.color, where: c.page + ' — ' + c.where, devices: c.devices, campaigns: c.campaigns, empty: c.campaigns.length === 0, previewHref: c.href },
